function openModal(html, wide) {
  closePop();
  const m = document.getElementById('modal');
  m.className = 'modal' + (wide ? ' wide' : '');
  m.innerHTML = html;
  document.getElementById('modalOverlay').style.display = 'flex';
  setTimeout(() => { const f = m.querySelector('[autofocus]'); if (f) { f.focus(); if (f.select) f.select(); } }, 30);
}
function closeModal() { document.getElementById('modalOverlay').style.display = 'none'; }

// ---------- Neue Reihe ----------
function openNewUnit() {
  if (!state.classes.length) { openTimetable(); return; }
  const pre = state.classFilter !== 'all' ? state.classFilter : state.classes[0].id;
  openModal(`<h3>Neue Unterrichtsreihe</h3><div class="sub">Die Reihe bleibt „in Vorbereitung“, bis du ein Startdatum festlegst und sie überträgst.</div>
    <label>Klasse</label><select id="nuClass">${state.classes.map(c => `<option value="${c.id}" ${c.id === pre ? 'selected' : ''}>${escHtml(c.name)}</option>`).join('')}</select>
    <label>Thema der Reihe</label><input type="text" id="nuTitle" placeholder="z. B. Prozentrechnung" autofocus onkeydown="if(event.key==='Enter') createUnit()">
    <label>Anzahl Stunden</label><input type="number" id="nuCount" min="1" max="60" value="10" onkeydown="if(event.key==='Enter') createUnit()">
    <div class="modal-actions"><button class="btn" onclick="closeModal()">Abbrechen</button><button class="btn primary" onclick="createUnit()">Reihe anlegen</button></div>`);
}
function createUnit() {
  const title = document.getElementById('nuTitle').value.trim();
  const n = Math.max(1, Math.min(60, parseInt(document.getElementById('nuCount').value, 10) || 0));
  if (!title) { document.getElementById('nuTitle').focus(); return; }
  const titles = Array.from({ length: n }, (_, i) => `Stunde ${i + 1}`);
  state.units.push(mkUnit(document.getElementById('nuClass').value, title, titles));
  state.view = 'units';
  save(); closeModal(); render();
  showToast('Reihe angelegt – jetzt die Stundenthemen eintragen ✓');
}

// ---------- Reihe übertragen ----------
function openInsert(unitId, startDate, redistribute) {
  const u = unitById(unitId);
  let start = startDate || u.start || state.week;
  if (start < START) start = START;
  const placed = placedMap();
  openModal(`<h3>Reihe in den Planer übertragen</h3>
    <div class="sub">Jede Stunde kommt in die nächste freie Stunde der Klasse – nach dem jeweils gültigen Stundenplan. Ferien, freie Tage und Ausfälle werden übersprungen.</div>
    <label>Reihe</label><select id="insUnit" onchange="updateInsertPreview()">${state.units.filter(x => !x.single || x.id === u.id).map(x => {
      const st = unitStats(x, placed);
      return `<option value="${x.id}" ${x.id === unitId ? 'selected' : ''}>${escHtml(className(x.classId))} · ${escHtml(x.title)} (${st.placed}/${st.total})</option>`;
    }).join('')}</select>
    <label>Startdatum</label><input type="date" id="insStart" min="${START}" max="${END}" value="${start}" onchange="updateInsertPreview()">
    <label class="check"><input type="checkbox" id="insRedis" ${redistribute ? 'checked' : ''} onchange="updateInsertPreview()"> bereits eingeplante Stunden dieser Reihe neu verteilen</label>
    <div class="preview" id="insPreview"></div>
    <div class="modal-actions"><button class="btn" onclick="closeModal()">Abbrechen</button><button class="btn primary" id="insGo" onclick="confirmInsert()">Übertragen</button></div>`);
  updateInsertPreview();
}
function updateInsertPreview() {
  const unitId = document.getElementById('insUnit').value;
  const start = document.getElementById('insStart').value || START;
  const redis = document.getElementById('insRedis').checked;
  const prev = document.getElementById('insPreview');
  const go = document.getElementById('insGo');
  const p = planInsert(unitId, start, redis);
  if (!classSlots(p.unit.classId, start).length) {
    prev.innerHTML = `<span class="warn">${escHtml(className(p.unit.classId))} hat ab diesem Datum keine Stunden im Stundenplan.</span> <button class="btn small" onclick="closeModal();openTimetable()">Stundenplan öffnen</button>`;
    go.disabled = true; return;
  }
  const ok = p.assign.filter(a => a.key);
  const miss = p.assign.length - ok.length;
  go.disabled = !ok.length;
  if (!p.assign.length) { prev.innerHTML = 'Alle Stunden sind schon eingeplant. Haken setzen, um sie neu zu verteilen.'; return; }
  prev.innerHTML = `<b>${ok.length} Stunde(n)</b>${ok.length ? ` · ${fmtDay(dateOf(ok[0].key))} bis ${fmtDay(dateOf(ok[ok.length - 1].key))}` : ''}
    ${miss ? `<div class="warn">${miss} Stunde(n) passen nicht mehr ins Schuljahr.</div>` : ''}
    <ol>${p.assign.map(a => `<li>${escHtml(a.lesson.title)} → ${a.key ? fmtKey(a.key) : '<span class="warn">kein Platz</span>'}</li>`).join('')}</ol>`;
}
function confirmInsert() {
  const unitId = document.getElementById('insUnit').value;
  const start = document.getElementById('insStart').value || START;
  const redis = document.getElementById('insRedis').checked;
  closeModal();
  const n = placeUnit(unitId, start, redis);
  if (state.view === 'week') state.week = mondayOf(start);
  save(); render();
  showToast(`${n} Stunde(n) übertragen ✓`);
}

// ---------- Stundenplan & Klassen ----------
let ttSel = null, brush = null;
function openTimetable() {
  if (!ttSel || !state.timetables.find(t => t.id === ttSel)) ttSel = ttFor(state.week).id;
  if (brush === null || (brush && !classById(brush))) brush = state.classes[0] ? state.classes[0].id : '';
  openModal('<div id="ttModal"></div>', true);
  renderTTModal();
}
function renderTTModal() {
  const box = document.getElementById('ttModal'); if (!box) return;
  const versions = sortedTT();
  const tt = state.timetables.find(t => t.id === ttSel) || versions[0];
  const isFirst = tt === versions[0];
  let h = `<h3>Stundenplan &amp; Klassen</h3>
    <div class="sub">Ein Stundenplan für alle deine Klassen. Bei einem Stundenplanwechsel legst du einen neuen Reiter „ab Datum“ an – er gilt bis zum nächsten Wechsel bzw. bis zum Schuljahresende.</div>
    <h4>Klassen</h4><div class="class-list">`;
  state.classes.forEach(c => {
    h += `<div class="class-row"><span class="cdot" style="background:${classSubj(c).dot};width:12px;height:12px"></span>
      <input type="text" value="${escAttr(c.name)}" oninput="classById('${c.id}').name=this.value.trim()||'Klasse'; save(); render()" onblur="renderTTModal()">
      <span class="muted" style="font-size:11.5px">Fach</span>
      <select style="width:130px" onchange="classById('${c.id}').subject=this.value; save(); render(); renderTTModal()">${SUBJECT_KEYS.map(k => `<option value="${k}" ${k === c.subject ? 'selected' : ''}>${SUBJECTS[k].name}</option>`).join('')}</select>
      <div class="spacer"></div><span class="muted" style="font-size:11.5px">${state.units.filter(u => u.classId === c.id && !u.single).length} Reihen</span>
      <button class="btn small danger" onclick="deleteClass('${c.id}')">Löschen</button></div>`;
  });
  h += `</div><div style="margin-top:8px"><button class="add-btn" onclick="addClass()">＋ Klasse</button></div>
    <h4>Stundenplan</h4>
    <div class="tabs">${versions.map(v => `<button class="tab ${v === tt ? 'active' : ''}" onclick="ttSel='${v.id}'; renderTTModal()">ab ${ddmmyyyy(v.from)}<small>bis ${ddmmyyyy(ttUntil(v))}</small></button>`).join('')}
      <div class="new-version"><input type="date" id="newTTDate" min="${addDays(START, 1)}" max="${END}"><button class="btn small" onclick="addTTVersion()">＋ Neuer Stundenplan ab…</button></div>
    </div>
    <div class="tt-toolbar">
      <span style="font-size:12px;font-weight:600;color:var(--text2)">Eintragen:</span>
      ${state.classes.map(c => `<button class="brush ${brush === c.id ? 'active' : ''}" onclick="brush='${c.id}'; renderTTModal()"><span class="cdot" style="background:${classSubj(c).dot}"></span>${escHtml(c.name)}</button>`).join('')}
      <button class="brush ${brush === '' ? 'active' : ''}" onclick="brush=''; renderTTModal()">✕ leeren</button>
      <div class="spacer"></div>
      ${isFirst ? '' : `<label style="margin:0;font-size:12px">gilt ab</label><input type="date" style="width:150px" value="${tt.from}" min="${addDays(START, 1)}" max="${END}" onchange="changeTTDate('${tt.id}', this.value)">`}
    </div>
    <div class="tt-grid">${ttGridHtml(tt)}</div>
    <div class="info-box">
      <span>Bereits eingeplante Stunden bleiben auf ihren Terminen. Nach einer Änderung kannst du sie ab ${fmtDay(tt.from)} automatisch an diesen Stundenplan anpassen (je Klasse in derselben Reihenfolge).</span>
      <div class="spacer"></div>
      <button class="btn small primary" onclick="doReflow('${tt.from}')">Stunden ab ${ddmm(tt.from)} anpassen</button>
      ${isFirst ? '' : `<button class="btn small danger" onclick="deleteTTVersion('${tt.id}')">Diesen Stundenplan löschen</button>`}
    </div>
    <h4>Daten</h4>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn small" onclick="resetPlan()">Planung leeren (Klassen &amp; Stundenplan bleiben)</button>
      <button class="btn small danger" onclick="resetAll()">Alles löschen (Neustart)</button>
    </div>
    <div class="modal-actions"><button class="btn primary" onclick="closeModal()">Fertig</button></div>`;
  box.innerHTML = h;
}
function ttGridHtml(tt) {
  let h = '<div></div>';
  for (let d = 1; d <= 5; d++) h += `<div class="tt-head" style="grid-column:${d + 1};grid-row:1">${DAY_FULL[d]}</div>`;
  for (let p = 1; p <= 9; p++) h += `<div class="period-no" style="grid-row:${p + 1}">${p}</div>`;
  for (let d = 1; d <= 5; d++) SLOTS[d].forEach(s => {
    const [a, b] = periods(s);
    const c = classById((tt.slots[d] || {})[s]);
    h += `<div class="tt-slot ${c ? 'on' : ''}" style="grid-column:${d + 1};grid-row:${a + 1}/${b + 2};${c ? `--u-bg:${classSubj(c).bg};--u-dot:${classSubj(c).dot}` : ''}" onclick="paintSlot('${tt.id}',${d},'${s}')">
      <span style="opacity:.6">${slotLabel(s)}</span>${c ? escHtml(c.name) : ''}</div>`;
  });
  return h;
}
function paintSlot(ttId, d, s) {
  const tt = state.timetables.find(t => t.id === ttId);
  tt.slots[d] = tt.slots[d] || {};
  if (!brush || tt.slots[d][s] === brush) delete tt.slots[d][s];
  else tt.slots[d][s] = brush;
  save(); render(); renderTTModal();
}
function addTTVersion() {
  const v = document.getElementById('newTTDate').value;
  if (!v) { showToast('Bitte zuerst ein Datum wählen'); return; }
  if (v <= START || v > END) { showToast('Datum muss im Schuljahr nach dem 26.10. liegen'); return; }
  const exist = state.timetables.find(t => t.from === v);
  if (exist) { ttSel = exist.id; renderTTModal(); return; }
  const base = ttFor(v);
  const nt = { id: uid(), from: v, slots: JSON.parse(JSON.stringify(base.slots)) };
  state.timetables.push(nt); ttSel = nt.id;
  save(); render(); renderTTModal();
  showToast(`Neuer Stundenplan ab ${fmtDay(v)} – Kopie des vorherigen, jetzt anpassen`);
}
function changeTTDate(id, v) {
  if (!v || v <= START || state.timetables.some(t => t.id !== id && t.from === v)) { showToast('Ungültiges Datum'); renderTTModal(); return; }
  state.timetables.find(t => t.id === id).from = v; save(); render(); renderTTModal();
}
function deleteTTVersion(id) {
  if (!confirm('Diesen Stundenplan löschen? Ab dem Datum gilt dann wieder der vorherige.')) return;
  state.timetables = state.timetables.filter(t => t.id !== id); ttSel = sortedTT()[0].id;
  save(); render(); renderTTModal();
}
function doReflow(from) {
  if (!confirm(`Alle eingeplanten Stunden ab ${ddmmyyyy(from)} werden je Klasse der Reihe nach auf die Stunden des gültigen Stundenplans verteilt. Fortfahren?`)) return;
  const lost = reflowFrom(from);
  save(); render();
  showToast(lost ? `Angepasst – ${lost} Stunde(n) passen nicht mehr ins Schuljahr` : 'Stunden angepasst ✓');
}
function addClass() {
  const c = { id: uid(), name: `Klasse ${state.classes.length + 1}`, subject: 'mathe' };
  state.classes.push(c); brush = c.id;
  save(); render(); renderTTModal();
}
function deleteClass(id) {
  const n = state.units.filter(u => u.classId === id).length;
  if (!confirm(`Klasse löschen?${n ? ` Ihre ${n} Reihe(n) werden mit gelöscht.` : ''}`)) return;
  state.units.filter(u => u.classId === id).forEach(u => u.lessons.forEach(l => unplace(l.id)));
  state.units = state.units.filter(u => u.classId !== id);
  state.timetables.forEach(t => Object.values(t.slots).forEach(day => Object.keys(day).forEach(s => { if (day[s] === id) delete day[s]; })));
  state.classes = state.classes.filter(c => c.id !== id);
  if (state.classFilter === id) state.classFilter = 'all';
  if (brush === id) brush = state.classes[0] ? state.classes[0].id : '';
  save(); render(); renderTTModal();
}
function resetPlan() {
  if (!confirm('Alle Reihen, Einträge, Ausfälle und Notizen löschen? Klassen und Stundenplan bleiben.')) return;
  Object.assign(state, { units: [], placements: {}, cancelled: {}, subs: {}, weekNotes: {}, weekEvents: {}, freeDays: defaultFreeDays() });
  save(); render(); renderTTModal();
}
function resetAll() {
  if (!confirm('Wirklich ALLES löschen – Klassen, Stundenplan, Reihen, Notizen? Tipp: vorher exportieren.')) return;
  try { localStorage.removeItem(STORE_KEY); } catch (e) {}
  load(); ttSel = null; brush = null; save(); closeModal(); render();
}

// =====================================================================
//  POPOVER
// =====================================================================
let popOpen = false;
function showPop(anchor, html) {
  const pop = document.getElementById('pop');
  pop.innerHTML = html; pop.style.display = 'block'; popOpen = true;
  const r = anchor.getBoundingClientRect();
  const pw = pop.offsetWidth, ph = pop.offsetHeight;
  let x = r.left, y = r.bottom + 6;
  if (x + pw > window.innerWidth - 10) x = window.innerWidth - pw - 10;
  if (y + ph > window.innerHeight - 10) y = Math.max(10, r.top - ph - 6);
  pop.style.left = Math.max(10, x) + 'px'; pop.style.top = y + 'px';
  const f = pop.querySelector('[autofocus]'); if (f) setTimeout(() => f.focus(), 20);
}
function closePop(rerender) {
  if (!popOpen) return;
  document.getElementById('pop').style.display = 'none'; popOpen = false;
  if (rerender) render();
}
document.addEventListener('mousedown', e => { if (popOpen && !document.getElementById('pop').contains(e.target)) closePop(true); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') { closePop(true); closeModal(); } });

function choiceRow(lessonId, field, options, current) {
  return `<div class="choice" data-field="${field}">${options.map(([v, label]) =>
    `<button class="${field}-${v || 'none'} ${v === current ? 'active' : ''}" onclick="setLessonField('${lessonId}','${field}','${v}'); this.parentElement.querySelectorAll('button').forEach(b => b.classList.toggle('active', b === this))">${label}</button>`).join('')}</div>`;
}
function lessonClick(e, lessonId) {
  e.stopPropagation();
  const info = lessonInfo(lessonId); const key = placedMap()[lessonId];
  const l = info.lesson;
  const single = !!info.unit.single;
  showPop(e.currentTarget, `<h4 style="color:${classSubj(classById(info.unit.classId)).fg}">${escHtml(className(info.unit.classId))}${single ? '' : ` · ${escHtml(info.unit.title)}`}</h4>
    <div class="sub">${single ? '' : `Stunde ${info.idx + 1}/${info.unit.lessons.length} · `}${fmtKey(key)}</div>
    <label>Planungsstand</label>
    ${choiceRow(lessonId, 'status', [['', 'offen'], ['wip', 'drucken'], ['done', 'fertig']], l.status || '')}
    <label>Leistungsnachweis</label>
    ${choiceRow(lessonId, 'exam', [['', 'keiner'], ['test', 'Test'], ['ka', 'Klassenarbeit']], l.exam || '')}
    <label>Stundenthema</label><input type="text" value="${escAttr(info.lesson.title)}" oninput="setLessonTitle('${lessonId}', this.value)" onkeydown="if(event.key==='Enter') closePop(true)">
    <label>Notiz</label><textarea oninput="lessonInfo('${lessonId}').lesson.note=this.value; save()" placeholder="Material, Hausaufgaben…">${escHtml(info.lesson.note || '')}</textarea>
    <div class="pop-actions">
      <button class="btn ${l.pinned ? 'primary' : ''}" onclick="togglePin(event,'${lessonId}')">📌 ${l.pinned ? 'Fixiert – lösen' : 'Termin fixieren'}</button>
      <div class="pop-row"><button class="btn" onclick="moveStep('${lessonId}',-1)">← eine Stunde früher</button><button class="btn" onclick="moveStep('${lessonId}',1)">eine später →</button></div>
      <div class="pop-sep"></div>
      ${state.subs[key] ? subRemoveButtons(key) : `<label style="margin-top:2px">Stunde fällt aus – Grund</label><input type="text" id="cReason" value="Ausfall">
      <button class="btn" onclick="cancelSlot('${key}', document.getElementById('cReason').value, 'shift')">✕ Fällt aus · Folgestunden rücken nach</button>
      <button class="btn" onclick="cancelSlot('${key}', document.getElementById('cReason').value, 'park')">✕ Fällt aus · Stunde ${single ? 'ohne Termin aufheben' : 'zurück in die Reihe'}</button>`}
      <div class="pop-sep"></div>
      ${single ? `<button class="btn danger" onclick="deleteSingle('${info.unit.id}')">Einzelstunde löschen</button>`
        : `<button class="btn danger" onclick="unplace('${lessonId}'); closePop(); save(); render()">Aus dem Planer nehmen</button>`}
    </div>`);
}
// ---------- Vertretungen ----------
function subForm(key) {
  return `<div class="pop-actions"><div class="pop-sep"></div></div>
    <label>Vertretung in dieser Stunde</label>
    <select id="sbClass" onchange="subFormToggle()"><option value="">andere Klasse (nicht meine)</option>${state.classes.map(c => `<option value="${c.id}">${escHtml(c.name)} – zusätzliche Stunde</option>`).join('')}</select>
    <input type="text" id="sbLabel" placeholder="Klasse / Fach, z. B. Ma 7e">
    <label class="check" id="sbPullRow" style="display:none"><input type="checkbox" id="sbPull" checked onchange="subFormToggle()"> Folgestunden der Reihe rücken eine Stunde vor</label>
    <input type="text" id="sbTopic" placeholder="Stundenthema (optional)">
    <div class="pop-actions"><button class="btn" onclick="addSubFromForm('${key}')">＋ Vertretung eintragen</button></div>`;
}
function subFormToggle() {
  const own = !!document.getElementById('sbClass').value;
  const pull = document.getElementById('sbPull').checked;
  document.getElementById('sbLabel').style.display = own ? 'none' : '';
  document.getElementById('sbPullRow').style.display = own ? '' : 'none';
  document.getElementById('sbTopic').style.display = own && pull ? 'none' : '';
}
function addSubFromForm(key) {
  const classId = document.getElementById('sbClass').value;
  const topic = document.getElementById('sbTopic').value.trim();
  if (classId) {
    const pull = document.getElementById('sbPull').checked;
    state.subs[key] = { classId };
    if (pull) pullForward(classId, key);
    else if (topic) { addSingle(key, classId, topic); return; }
    closePop(); save(); render();
    showToast(pull ? (state.placements[key] ? 'Vertretung eingetragen – Folgestunden sind vorgerückt' : 'Vertretung eingetragen') : 'Vertretung eingetragen');
  } else {
    const label = document.getElementById('sbLabel').value.trim();
    if (!label) { showToast('Bitte Klasse / Fach eintragen'); return; }
    state.subs[key] = { label, topic, note: '' };
    closePop(); save(); render();
  }
}
// mode 'back': Stunde der eigenen Klasse geht zurück, Folgestunden rücken nach hinten · 'park': Stunde zurück in die Reihe
function removeSub(key, mode) {
  const sub = state.subs[key]; if (!sub) return;
  const id = sub.classId ? state.placements[key] : null;
  if (id) delete state.placements[key];
  delete state.subs[key];
  if (id && mode === 'back') reportOverflow(shiftInto(classSlots(sub.classId, dateOf(key)).filter(k => keyCmp(k, key) > 0), [id]));
  closePop(); save(); render();
}
function setSubField(key, field, v) { state.subs[key][field] = v; save(); }
function subClick(e, key) {
  e.stopPropagation();
  const sub = state.subs[key];
  showPop(e.currentTarget, `<h4>Vertretung</h4><div class="sub">${fmtKey(key)}</div>
    <label>Klasse / Fach</label><input type="text" value="${escAttr(sub.label || '')}" oninput="setSubField('${key}','label',this.value)">
    <label>Stundenthema</label><input type="text" value="${escAttr(sub.topic || '')}" placeholder="z. B. Übung" oninput="setSubField('${key}','topic',this.value)" onkeydown="if(event.key==='Enter') closePop(true)">
    <label>Notiz</label><textarea oninput="setSubField('${key}','note',this.value)" placeholder="Material, Aufgaben…">${escHtml(sub.note || '')}</textarea>
    <div class="pop-actions"><div class="pop-sep"></div><button class="btn danger" onclick="removeSub('${key}')">Vertretung löschen</button></div>`);
}
const subRemoveButtons = key => `<button class="btn" onclick="removeSub('${key}','back')">Vertretung entfernen · Stunden rücken wieder zurück</button>
  <button class="btn danger" onclick="removeSub('${key}','park')">Vertretung entfernen · Stunde zurück in die Reihe</button>`;
function togglePin(e, lessonId) {
  e.stopPropagation();
  const l = lessonInfo(lessonId).lesson;
  l.pinned = !l.pinned;
  save(); if (popOpen) closePop(); render();
  showToast(l.pinned ? '📌 Termin fixiert – bleibt beim Verschieben stehen' : 'Termin nicht mehr fixiert');
}

function slotClick(e, key) {
  const el = e.currentTarget;
  e.stopPropagation();
  const sub = state.subs[key];
  if (sub && !sub.classId && !el.classList.contains('half')) { subClick(e, key); return; }
  const regular = classAt(dateOf(key), slotOf(key));
  if (state.cancelled[key] && (!sub || el.classList.contains('half'))) {
    showPop(el, `<h4>${fmtKey(key)}</h4><div class="sub">${regular ? escHtml(className(regular)) + ' · ' : ''}fällt aus: ${escHtml(state.cancelled[key])}</div>
      <div class="pop-actions">
        ${sub ? `<div class="sub">In dieser Stunde liegt eine Vertretung – zum Aufheben des Ausfalls erst die Vertretung entfernen.</div>`
          : `${regular ? `<button class="btn" onclick="uncancel('${key}', true)">Ausfall aufheben · Folgestunden rücken wieder vor</button>` : ''}
        <button class="btn" onclick="uncancel('${key}', false)">Ausfall aufheben · Stunde bleibt leer</button>`}
      </div>${sub ? '' : subForm(key)}`);
    return;
  }
  const cId = sub ? sub.classId : regular;
  const placed = placedMap();
  // offene Stunden – die der Klasse dieses Slots zuerst
  const groups = state.classes.slice().sort((a, b) => (b.id === cId) - (a.id === cId)).map(c => {
    const opts = [];
    state.units.filter(u => u.classId === c.id).forEach(u => u.lessons.forEach((l, i) => { if (!placed[l.id]) opts.push(`<option value="${l.id}">${u.single ? escHtml(l.title) : `${escHtml(u.title)} · ${i + 1}. ${escHtml(l.title)}`}</option>`); }));
    return opts.length ? `<optgroup label="${escAttr(c.name)}">${opts.join('')}</optgroup>` : '';
  }).join('');
  showPop(el, `<h4>${fmtKey(key)}</h4><div class="sub">${sub ? 'Vertretung · ' : ''}${cId ? `${escHtml(className(cId))} · noch frei` : 'kein Unterricht laut Stundenplan'}</div>
    ${groups ? `<label>Stunde einsetzen</label><select id="popLesson">${groups}</select>
      <div class="pop-actions"><button class="btn primary" onclick="moveLesson(document.getElementById('popLesson').value,'${key}'); closePop(); save(); render()">Einsetzen</button></div>`
      : `<div class="sub">Keine offenen Stunden aus Reihen.</div>`}
    ${state.classes.length ? `<div class="pop-actions"><div class="pop-sep"></div></div>
    <label>Einzelstunde ohne Reihe – Stundenthema</label>
    <input type="text" id="sgTitle" placeholder="z. B. Übung" onkeydown="if(event.key==='Enter') document.getElementById('sgBtn').click()">
    ${cId ? `<input type="hidden" id="sgClass" value="${cId}">` : `<select id="sgClass">${state.classes.map(c => `<option value="${c.id}">${escHtml(c.name)}</option>`).join('')}</select>`}
    <div class="pop-actions"><button class="btn ${groups ? '' : 'primary'}" id="sgBtn" onclick="addSingle('${key}', document.getElementById('sgClass').value, document.getElementById('sgTitle').value)">＋ Einzelstunde eintragen</button></div>` : ''}
    ${sub ? `<div class="pop-actions"><div class="pop-sep"></div>${subRemoveButtons(key)}</div>`
      : cId ? `<div class="pop-actions"><div class="pop-sep"></div><label style="margin-top:2px">Fällt aus – Grund</label><input type="text" id="cReason" value="Ausfall">
      <button class="btn" onclick="cancelSlot('${key}', document.getElementById('cReason').value, 'park')">✕ Als Ausfall markieren</button></div>`
      : subForm(key)}`);
}
function dayClick(e, date) {
  e.stopPropagation();
  if (state.freeDays[date]) {
    showPop(e.currentTarget, `<h4>${DAY_FULL[dow(date)]}, ${ddmm(date)}</h4><div class="sub">${escHtml(state.freeDays[date])}</div>
      <div class="pop-actions"><button class="btn" onclick="unsetFreeDay('${date}')">Wieder Unterrichtstag</button></div>`);
    return;
  }
  const n = SLOTS[dow(date)].filter(s => state.placements[keyOf(date, s)]).length;
  showPop(e.currentTarget, `<h4>${DAY_FULL[dow(date)]}, ${ddmm(date)}</h4><div class="sub">Tag komplett ausblocken – es findet kein Unterricht statt</div>
    <div class="choice" style="flex-wrap:wrap">${FREE_LABELS.map((l, i) => `<button class="${i === 0 ? 'active' : ''}" onclick="document.getElementById('fdLabel').value='${l}'; this.parentElement.querySelectorAll('button').forEach(b => b.classList.toggle('active', b === this))">${l}</button>`).join('')}</div>
    <label>Bezeichnung</label><input type="text" id="fdLabel" value="${FREE_LABELS[0]}">
    <div class="pop-actions">
      ${n ? `<button class="btn" onclick="setFreeDay('${date}', document.getElementById('fdLabel').value, true)">Tag frei · ${n} Stunde(n) rücken nach</button>
      <button class="btn" onclick="setFreeDay('${date}', document.getElementById('fdLabel').value, false)">Tag frei · Stunden zurück in die Reihe</button>`
      : `<button class="btn primary" onclick="setFreeDay('${date}', document.getElementById('fdLabel').value, true)">Tag ausblocken</button>`}
      <div class="pop-sep"></div>
      <button class="btn" onclick="closePop(); state.sidePanel='events'; addEvent('${mondayOf(date)}','${date}')">＋ Termin an diesem Tag</button>
      <button class="btn" onclick="setFreeWeek('${mondayOf(date)}', document.getElementById('fdLabel').value)">Ganze Woche (Mo–Fr) ausblocken</button>
    </div>`);
}

// =====================================================================
//  DRAG & DROP
// =====================================================================
let drag = null, navTimer = null;
function dragStart(e, type, id) {
  drag = { type, id };
  e.dataTransfer.effectAllowed = 'move';
  try { e.dataTransfer.setData('text/plain', id); } catch (_) {}
  closePop();
  if (e.target.classList) e.target.classList.add('dragging');
}
function clearOver() { document.querySelectorAll('.drop-over').forEach(x => x.classList.remove('drop-over')); }
document.addEventListener('dragend', () => { drag = null; clearOver(); clearTimeout(navTimer); document.querySelectorAll('.dragging').forEach(x => x.classList.remove('dragging')); });

function bindDnD() {
  const grid = document.getElementById('weekGrid');
  if (grid) {
    grid.addEventListener('dragover', e => {
      if (!drag) return;
      const s = e.target.closest('.slot.droppable'); if (!s) return;
      e.preventDefault();
      if (!s.classList.contains('drop-over')) { clearOver(); s.classList.add('drop-over'); }
    });
    grid.addEventListener('drop', e => {
      const s = e.target.closest('.slot.droppable');
      if (!drag || !s) return;
      e.preventDefault();
      const key = s.dataset.key;
      if (drag.type === 'lesson') { moveLesson(drag.id, key); save(); render(); }
      else if (drag.type === 'unit') openInsert(drag.id, dateOf(key));
      drag = null; clearOver();
    });
  }
  const side = document.getElementById('sidebar');
  if (side) {
    side.addEventListener('dragover', e => { if (drag && drag.type === 'lesson' && placedMap()[drag.id]) { e.preventDefault(); side.classList.add('drop-over'); } });
    side.addEventListener('dragleave', e => { if (!side.contains(e.relatedTarget)) side.classList.remove('drop-over'); });
    side.addEventListener('drop', e => {
      if (!drag || drag.type !== 'lesson') return;
      e.preventDefault(); unplace(drag.id); drag = null; save(); render();
      showToast('Stunde zurück in die Reihe');
    });
  }
  [['navPrev', -1], ['navNext', 1]].forEach(([id, dir]) => {
    const b = document.getElementById(id); if (!b) return;
    b.addEventListener('dragover', e => { if (drag) e.preventDefault(); });
    b.addEventListener('dragenter', () => {
      if (!drag) return;
      b.classList.add('drop-over'); clearTimeout(navTimer);
      navTimer = setTimeout(() => gotoWeek(allWeeks().indexOf(state.week) + dir), 550);
    });
    b.addEventListener('dragleave', () => { b.classList.remove('drop-over'); clearTimeout(navTimer); });
  });
  const table = document.getElementById('yearTable');
  if (table) {
    table.addEventListener('dragover', e => {
      if (!drag || drag.type !== 'unit') return;
      const td = e.target.closest('td[data-week]'); if (!td) return;
      e.preventDefault();
      if (!td.classList.contains('drop-over')) { clearOver(); td.classList.add('drop-over'); }
    });
    table.addEventListener('drop', e => {
      const td = e.target.closest('td[data-week]');
      if (!drag || drag.type !== 'unit' || !td) return;
      e.preventDefault();
      const id = drag.id; drag = null; clearOver();
      openInsert(id, td.dataset.week);
    });
  }
}

// =====================================================================
//  EXPORT / IMPORT / UTIL
// =====================================================================
function exportData() {
  const blob = new Blob([JSON.stringify(state, null, 1)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `unterrichtsplaner_backup_${todayIso()}.json`; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
function importData(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const imported = JSON.parse(e.target.result);
      if (!imported.units || !imported.placements || !imported.timetables) throw new Error();
      if (confirm('Aktuelle Daten mit dem Import überschreiben?')) {
        state = Object.assign(emptyState(), imported);
        save(); load();
        save(); render(); showToast('Import erfolgreich ✓');
      }
    } catch (err) { alert('Ungültige Datei.'); }
    event.target.value = '';
  };
  reader.readAsText(file);
}
let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.display = 'block';
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.style.display = 'none', 2800);
}
function handleKey(e) { if (e.key === 'Enter') { e.preventDefault(); e.target.blur(); } }
function escHtml(s) { return s ? String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;') : ''; }
function escAttr(s) { return escHtml(s).replace(/"/g, '&quot;').replace(/'/g, '&#39;'); }

load();
save();
render();
</script>
