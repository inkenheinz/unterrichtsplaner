<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unterrichtsplaner</title>
<!-- iPad: „Zum Home-Bildschirm“ öffnet den Planer wie eine App -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Planer">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f7f6f9;
    --surface: #ffffff;
    --surface2: #f6f4f9;
    --border: #e6e2ec;
    --border2: #d3cbe0;
    --text: #25212e;
    --text2: #5a5468;
    --text3: #9d97ab;
    --accent: #7c6bb5;
    --accent-dark: #65559c;
    --accent-light: #eeeaf7;
    --cancel: #c0577a;
    --cancel-bg: #fcf0f4;
    --free-bg: #f3f1f6;
    --wip-bg: #fcf4dc; --wip-bd: #f0dd9f; --wip-dot: #e2b93b;
    --done-bg: #e9f3ea; --done-bd: #c6dfc6; --done-dot: #6fae78;
    --exam: #2b2540;
    --shadow-sm: 0 1px 2px rgba(37, 33, 46, 0.05);
    --shadow-md: 0 4px 12px rgba(37, 33, 46, 0.08);
    --shadow-lg: 0 16px 40px rgba(37, 33, 46, 0.16);
    --radius: 12px;
    --radius-sm: 8px;
    --row-h: 50px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'DM Sans', sans-serif; color: var(--text); font-size: 14px; min-height: 100vh; background: var(--bg); }
  button { font-family: inherit; }
  input, textarea, select { font-family: inherit; font-size: 13px; color: var(--text); }

  /* ---------- Header ---------- */
  .header {
    background: var(--surface); border-bottom: 1px solid var(--border);
    padding: 9px 24px; display: flex; align-items: center; gap: 10px 12px; flex-wrap: wrap;
    min-height: 58px; position: sticky; top: 0; z-index: 100;
  }
  .header-actions { display: flex; gap: 8px; margin-left: auto; }
  .logo { font-weight: 700; font-size: 15px; color: var(--text); white-space: nowrap; letter-spacing: -.2px; }
  .logo span { color: var(--accent); }
  .logo small { font-size: 10px; color: var(--text3); font-weight: 500; margin-left: 3px; }
  .seg { display: flex; background: var(--surface2); border: 1px solid var(--border); border-radius: 9px; padding: 3px; gap: 2px; flex-shrink: 0; }
  .seg button {
    border: none; background: transparent; padding: 6px 12px; border-radius: 6px; cursor: pointer;
    font-size: 12.5px; font-weight: 500; color: var(--text2); white-space: nowrap; display: flex; align-items: center; gap: 6px;
  }
  .seg button.active { background: white; color: var(--text); box-shadow: var(--shadow-sm), 0 0 0 1px var(--border); font-weight: 600; }
  .seg button:not(.active):hover { color: var(--accent); }
  .divider { width: 1px; height: 24px; background: var(--border); flex-shrink: 0; }
  .spacer { flex: 1; }
  .btn {
    padding: 7px 12px; border-radius: var(--radius-sm); border: 1px solid var(--border); cursor: pointer;
    font-size: 12.5px; font-weight: 500; background: var(--surface); color: var(--text2); white-space: nowrap;
  }
  .btn:hover { background: var(--surface2); border-color: var(--border2); }
  .btn.primary { background: var(--accent); color: white; border-color: var(--accent); }
  .btn.primary:hover { background: var(--accent-dark); }
  .btn.danger { color: var(--cancel); }
  .btn.danger:hover { background: var(--cancel-bg); border-color: #efc5d2; }
  .btn.small { padding: 4px 9px; font-size: 11.5px; }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .main { padding: 18px 24px 24px; max-width: 1560px; margin: 0 auto; }
  .add-btn {
    display: inline-flex; align-items: center; gap: 5px; padding: 4px 9px;
    border-radius: var(--radius-sm); border: 1px dashed var(--border2);
    background: transparent; color: var(--text3); font-size: 11.5px; cursor: pointer;
  }
  .add-btn:hover { color: var(--accent); border-color: var(--accent); background: var(--accent-light); }
  .muted { color: var(--text3); }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow-sm); }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--u-dot); flex-shrink: 0; display: inline-block; }
  .cdot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; display: inline-block; }
  .ctag { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 600; color: var(--text2); white-space: nowrap; }
  .badge { display: inline-block; font-size: 10.5px; font-weight: 600; padding: 2px 8px; border-radius: 10px; background: var(--surface2); color: var(--text2); border: 1px solid var(--border); white-space: nowrap; }
  .badge.prep { background: #fff7e6; color: #8a6414; border-color: #f2e0b3; }
  .badge.live { background: #ecf6ee; color: #3d7148; border-color: #cfe6d4; }
  .section-title { font-size: 13px; font-weight: 700; color: var(--text2); text-transform: uppercase; letter-spacing: .5px; margin: 6px 0 12px; display: flex; align-items: center; gap: 8px; }

  .banner { display: flex; align-items: center; gap: 14px; padding: 14px 18px; margin-bottom: 18px; background: var(--accent-light); border: 1px solid #ddd5ef; border-radius: var(--radius); color: var(--text2); }
  .banner b { color: var(--text); }

  /* ---------- Wochenplaner ---------- */
  .week-layout { display: grid; grid-template-columns: 280px 1fr; gap: 22px; align-items: start; }
  .week-layout > section { min-width: 0; }
  .week-layout.collapsed { grid-template-columns: 38px 1fr; gap: 12px; }
  .sidebar { overflow-x: hidden; }
  .week-layout.collapsed .sidebar { overflow: visible; }
  .side-tab {
    width: 34px; flex-shrink: 0; padding: 14px 0; border-radius: 10px; border: 1px solid var(--border); background: white; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 8px; color: var(--text2); font-size: 12.5px; font-weight: 600; box-shadow: var(--shadow-sm);
  }
  .side-tab span { writing-mode: vertical-rl; transform: rotate(180deg); letter-spacing: .3px; }
  .side-tab b { font-size: 10.5px; background: var(--accent); color: white; border-radius: 10px; min-width: 18px; padding: 1px 5px; }
  .side-tab:hover { border-color: var(--accent); color: var(--accent); }
  .sidebar.drop-over .side-tab { border-color: var(--accent); background: var(--accent-light); }
  .sidebar { position: sticky; top: calc(var(--hh, 58px) + 24px); display: flex; flex-direction: column; gap: 10px; max-height: calc(100vh - var(--hh, 58px) - 40px); overflow: auto; padding: 2px; border-radius: var(--radius); }
  .sidebar.drop-over { outline: 2px dashed var(--accent); background: var(--accent-light); }
  .side-title { display: flex; align-items: center; justify-content: space-between; margin-bottom: 2px; }
  .side-title h3 { font-size: 14px; font-weight: 700; }
  .side-close { cursor: pointer; padding: 3px 8px; margin-left: -8px; border-radius: 6px; }
  .side-close:hover { background: var(--accent-light); color: var(--accent); }
  .side-class { display: flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 700; color: var(--text3); text-transform: uppercase; letter-spacing: .4px; margin-top: 6px; }
  .unit-side { padding: 11px 12px 10px; border-radius: 10px; background: var(--surface); border: 1px solid var(--border); }
  .us-head { display: flex; align-items: center; gap: 8px; cursor: grab; }
  .us-head b { flex: 1; font-size: 13px; font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .us-count { font-size: 11px; color: var(--text3); font-variant-numeric: tabular-nums; }
  .progress { height: 4px; background: var(--surface2); border-radius: 4px; overflow: hidden; margin: 8px 0 6px; }
  .progress i { display: block; height: 100%; background: var(--u-dot); border-radius: 4px; }
  .us-meta { font-size: 11px; color: var(--text3); margin-bottom: 6px; }
  .unplaced { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 8px; }
  .mini-chip { font-size: 11px; padding: 2px 7px; border-radius: 5px; cursor: grab; max-width: 100%; background: var(--u-bg); color: var(--u-fg); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .us-actions { display: flex; gap: 6px; flex-wrap: wrap; }

  .week-nav { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
  .week-nav h2 { font-size: 20px; font-weight: 700; letter-spacing: -.3px; }
  .week-nav .kw { font-size: 12px; color: var(--text3); }
  .nav-btn { width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--border); background: white; cursor: pointer; font-size: 16px; color: var(--text2); display: flex; align-items: center; justify-content: center; }
  .nav-btn:hover, .nav-btn.drop-over { background: var(--accent-light); border-color: var(--accent); color: var(--accent); }
  .date-jump { display: flex; align-items: center; gap: 6px; padding: 3px 4px 3px 10px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: white; font-size: 13px; cursor: pointer; }
  .date-jump input { border: none; padding: 4px; background: transparent; font-size: 13px; }
  .date-jump input:focus { outline: none; }
  .tt-note { font-size: 11.5px; color: var(--text3); margin: -6px 0 12px; }

  .week-stage { position: relative; padding: 0 22px; }
  .side-arrow {
    position: absolute; top: 50%; transform: translateY(-50%); z-index: 6;
    width: 42px; height: 42px; border-radius: 50%; border: 1px solid var(--border); background: white;
    box-shadow: var(--shadow-md); cursor: pointer; font-size: 22px; line-height: 1; color: var(--text2);
    display: flex; align-items: center; justify-content: center; padding-bottom: 3px;
  }
  .side-arrow.left { left: 0; }
  .side-arrow.right { right: 0; }
  .side-arrow:hover:not(:disabled), .side-arrow.drop-over { background: var(--accent); border-color: var(--accent); color: white; }
  .side-arrow:disabled { opacity: .35; cursor: default; }
  .week-card { padding: 14px 26px; overflow-x: auto; }
  .week-grid { display: grid; grid-template-columns: 24px repeat(5, minmax(0, 1fr)); grid-template-rows: auto repeat(9, var(--row-h)); gap: 4px 8px; }
  /* niedrige Zeilen: Infozeile und Thema nebeneinander */
  .week-grid.compact .chip { flex-direction: row; align-items: center; gap: 6px; padding-top: 2px; padding-bottom: 2px; }
  .week-grid.compact .chip-meta { flex-shrink: 1; max-width: 55%; }
  .week-grid.compact .chip-title { flex: 1; min-width: 0; white-space: nowrap; display: block; }
  .week-grid.compact .chip .chip-no, .week-grid.compact .slot .slot-no { top: 50%; transform: translateY(-50%); }
  .week-grid.compact .day-head { padding-bottom: 4px; }
  .period-no { grid-column: 1; font-size: 11px; color: var(--text3); display: flex; align-items: center; justify-content: center; font-variant-numeric: tabular-nums; }
  .day-head { grid-row: 1; padding: 4px 8px 8px; border-radius: 8px; cursor: pointer; display: flex; align-items: baseline; gap: 8px; border-bottom: 2px solid var(--border); }
  .day-head:hover { background: var(--surface2); }
  .day-head .dn { font-weight: 700; font-size: 14px; }
  .day-head .dd { font-size: 12px; color: var(--text3); }
  .day-head.today { border-bottom-color: var(--accent); }
  .day-head.today .dn { color: var(--accent); }
  .slot { position: relative; border-radius: 8px; padding: 5px 8px 5px 34px; display: flex; align-items: center; gap: 6px; border: 1px solid transparent; cursor: pointer; min-width: 0; }
  .slot .slot-no { position: absolute; left: 8px; top: 7px; font-size: 10.5px; color: var(--text3); font-weight: 500; }
  .slot.other { background: rgba(246,244,249,.6); }
  .slot.other:hover { background: var(--surface2); }
  .slot.cls { background: white; border: 1px dashed var(--border2); }
  .slot.cls:hover { border-color: var(--accent); background: var(--accent-light); }
  .slot.filled { border: none; padding: 0; background: transparent; }
  .slot.filled .slot-no { display: none; }
  .slot-empty { font-size: 11px; color: var(--text3); font-style: italic; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .slot.cancelled { background: repeating-linear-gradient(-45deg, var(--cancel-bg), var(--cancel-bg) 5px, #fff 5px, #fff 10px); border: 1px solid #f0cbd7; }
  .cancel-tag { font-size: 11px; color: var(--cancel); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .slot.drop-over { outline: 2px solid var(--accent); outline-offset: 1px; background: var(--accent-light) !important; }
  .free-day { grid-row: 2 / 11; border-radius: 10px; display: flex; align-items: center; justify-content: center; text-align: center; background: var(--free-bg); border: 1px solid var(--border); cursor: pointer; color: var(--text3); font-weight: 600; font-size: 13px; padding: 8px; }

  .chip {
    flex: 1; align-self: stretch; min-width: 0; border-radius: 8px; padding: 4px 9px 4px 34px; position: relative;
    background: white; border: 1px solid var(--border); border-left: 4px solid var(--u-dot); color: var(--text);
    cursor: grab; display: flex; flex-direction: column; justify-content: center; overflow: hidden; transition: box-shadow .12s;
  }
  .chip.st-wip { background: var(--wip-bg); border-color: var(--wip-bd); border-left-color: var(--u-dot); }
  .chip.st-done { background: var(--done-bg); border-color: var(--done-bd); border-left-color: var(--u-dot); }
  .chip.has-exam { border-color: var(--exam); border-width: 1.5px; border-left: 4px solid var(--u-dot); }
  .chip-meta b { font-weight: 700; color: var(--u-fg); }
  .st-dot { width: 13px; height: 13px; border-radius: 50%; border: 1.5px solid var(--border2); background: white; cursor: pointer; flex-shrink: 0; padding: 0; }
  .st-dot:hover { transform: scale(1.15); }
  .st-dot.wip { background: var(--wip-dot); border-color: var(--wip-dot); }
  .st-dot.done { background: var(--done-dot); border-color: var(--done-dot); }
  .chip .st-dot { position: absolute; right: 7px; top: 7px; }
  .exam-badge { display: inline-block; font-size: 9.5px; font-weight: 700; letter-spacing: .3px; padding: 1px 5px; border-radius: 4px; margin-right: 5px; vertical-align: 1px; text-transform: uppercase; white-space: nowrap; }
  .exam-badge.ka { background: var(--exam); color: white; border: 1px solid var(--exam); }
  .exam-badge.test { background: white; color: var(--exam); border: 1px solid var(--exam); }
  .day-head .exam-badge { margin: 0 0 0 auto; align-self: center; }
  .day-head .exam-badge + .exam-badge { margin-left: 4px; }
  .choice { display: flex; gap: 4px; }
  .choice button { flex: 1; padding: 5px 4px; font-size: 11.5px; border-radius: 6px; border: 1px solid var(--border); background: white; color: var(--text2); cursor: pointer; }
  .choice button:hover { border-color: var(--border2); }
  .choice button.active { font-weight: 700; color: var(--text); border-color: var(--text); }
  .choice button.status-wip.active { background: var(--wip-bg); border-color: var(--wip-dot); }
  .choice button.status-done.active { background: var(--done-bg); border-color: var(--done-dot); }
  .choice button.exam-test.active { background: white; border-color: var(--exam); color: var(--exam); }
  .choice button.exam-ka.active { background: var(--exam); border-color: var(--exam); color: white; }
  .chip:hover { box-shadow: var(--shadow-md); }
  /* Vertretung + geteilte Kachel */
  .slot-split { display: flex; gap: 4px; min-width: 0; }
  .slot-split > .slot { flex: 1 1 0; min-width: 0; }
  .slot-split.two > .slot { padding-left: 8px; flex-direction: column; align-items: flex-start; justify-content: center; gap: 2px; }
  .slot-split.two > .slot .slot-no { display: none; }
  .slot-split.two > .slot.filled { padding: 0; }
  .slot-split.two .chip { padding-left: 9px; }
  .slot-split.two .chip .chip-no { display: none; }
  .slot-split.two .chip-meta { white-space: normal; line-height: 1.25; }
  .slot-split.two .ctag, .slot-split.two .cancel-tag { max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
  .sub-badge { display: inline-block; font-size: 9px; font-weight: 700; letter-spacing: .3px; text-transform: uppercase; padding: 0 4px; border-radius: 4px; margin-right: 5px; background: #ece8f6; color: #5b4c94; vertical-align: 1px; }
  .sub-stack { display: flex; flex-direction: column; align-items: flex-start; gap: 1px; min-width: 0; }
  .chip.sub-foreign { --u-dot: #9a95a6; --u-fg: #4b4658; border-style: dashed; border-left-style: solid; cursor: pointer; }
  .pin-btn { position: absolute; top: 3px; right: 3px; border: none; background: none; cursor: pointer; font-size: 11px; line-height: 1; padding: 2px; opacity: .3; filter: grayscale(1); }
  .pin-btn:hover { opacity: .7; }
  .pin-btn.on { opacity: 1; filter: none; }
  .chip.pinned { box-shadow: inset 0 0 0 1px var(--exam); }
  .chip:has(.pin-btn) .chip-meta, .chip:has(.pin-btn) .chip-title { padding-right: 14px; }
  label.check { display: flex; align-items: center; gap: 6px; font-weight: 500; text-transform: none; letter-spacing: 0; }
  label.check input { width: auto; margin: 0; }
  .chip .chip-no { position: absolute; left: 7px; top: 7px; font-size: 10.5px; opacity: .65; font-weight: 600; }
  .chip-meta { font-size: 10.5px; opacity: .8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 500; }
  .chip-title { font-size: 12.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.3; }
  .chip.dragging { opacity: .4; }

  .panel-tabs { display: flex; background: var(--surface2); border: 1px solid var(--border); border-radius: 9px; padding: 3px; gap: 2px; }
  .panel-tabs button { flex: 1; border: none; background: transparent; padding: 6px 4px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 500; color: var(--text2); display: flex; align-items: center; justify-content: center; gap: 5px; }
  .panel-tabs button.active { background: white; color: var(--text); font-weight: 700; box-shadow: var(--shadow-sm), 0 0 0 1px var(--border); }
  .panel-tabs button b, .side-tab b { font-size: 10px; background: var(--accent); color: white; border-radius: 10px; min-width: 17px; padding: 1px 5px; font-weight: 600; }
  .panel-tabs b.dotmark, .side-tab b.dotmark { min-width: 8px; width: 8px; height: 8px; padding: 0; }
  .panel-sub { font-size: 12px; font-weight: 600; color: var(--text2); margin-top: 4px; }
  .notes-area.panel-notes { min-height: 320px; background: white; }
  .notes-area { width: 100%; min-height: 84px; border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 8px 10px; resize: vertical; background: var(--surface2); }
  .notes-area:focus { outline: none; border-color: var(--accent); background: white; }
  .legend { display: flex; gap: 14px; align-items: center; font-size: 11.5px; color: var(--text3); margin-top: 12px; flex-wrap: wrap; }
  .legend i { display: inline-block; width: 14px; height: 10px; border-radius: 3px; vertical-align: middle; margin-right: 4px; }

  .editable-item { display: flex; align-items: center; gap: 6px; padding: 4px 8px; border-radius: 6px; font-size: 12px; margin-bottom: 4px; border: 1px solid var(--border); background: white; }
  .editable-item:focus-within { border-color: var(--accent); }
  .ev-day { font: inherit; font-size: 11px; font-weight: 600; color: var(--text2); border: 1px solid var(--border); border-radius: 5px; background: var(--surface2); padding: 1px 2px; flex-shrink: 0; max-width: 92px; }
  .ev-mark { font-size: 10.5px; font-weight: 600; color: var(--text2); background: var(--surface2); border: 1px solid var(--border); border-radius: 5px; padding: 0 6px; min-width: 0; flex: 0 1 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; align-self: center; }
  .chip-text { flex: 1; outline: none; cursor: text; min-height: 1.2em; white-space: pre-wrap; }
  .chip-btn { border: none; background: none; cursor: pointer; color: var(--text3); font-size: 10px; }
  .chip-btn:hover { color: var(--cancel); }

  /* ---------- Jahresplanung ---------- */
  .palette { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 12px 14px; margin-bottom: 16px; }
  .palette .hint { font-size: 12px; color: var(--text3); margin-left: 4px; }
  .pal-chip { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 7px; cursor: grab; font-size: 12px; font-weight: 600; background: var(--u-bg); color: var(--u-fg); }
  .pal-chip small { font-weight: 500; opacity: .75; }
  .year-table { width: 100%; border-collapse: separate; border-spacing: 0; table-layout: fixed; }
  .year-table th { background: var(--surface2); border-bottom: 1px solid var(--border); padding: 10px 14px; text-align: left; font-size: 11.5px; font-weight: 700; color: var(--text2); position: sticky; top: var(--hh, 58px); z-index: 5; }
  .year-table th:first-child { width: 104px; border-top-left-radius: var(--radius); }
  .year-table th:last-child { width: 128px; border-top-right-radius: var(--radius); }
  .year-table th { padding: 10px 8px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .year-table td { padding: 8px 8px; border-bottom: 1px solid var(--border); vertical-align: top; border-right: 1px solid var(--border); }
  .year-table td:last-child { border-right: none; }
  .year-table tr:last-child td { border-bottom: none; }
  .year-table tr.holiday td { background: var(--free-bg); }
  .year-table td.drop-over { background: var(--accent-light) !important; }

<script>
// =====================================================================
//  KONSTANTEN
// =====================================================================
const STORE_KEY = 'u_planer_proto_v2';
const START = '2026-10-26';
const END = '2027-07-02';
const DAY_SHORT = ['So','Mo','Di','Mi','Do','Fr','Sa'];
const DAY_FULL = ['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'];
// Stundenraster: welche Stunden pro Tag Blöcke bzw. Einzelstunden sind
const GRIDS = {
  standard: {
    name: 'Standard',
    slots: {
      1: ['1-2','3-4','5-6','7'],
      2: ['1-2','3','4-5','6-7','8-9'],
      3: ['1-2','3','4-5','6-7','8-9'],
      4: ['1-2','3','4-5','6-7','8-9'],
      5: ['1-2','3','4-5','6-7'],
    },
  },
  // Schuljahr 26/27, zwei Schulen: Mittwoch und Donnerstag weichen ab (aktives Raster)
  sj2627: {
    name: 'Schuljahr 26/27',
    slots: {
      1: ['1-2','3-4','5-6','7'],
      2: ['1-2','3','4-5','6-7','8-9'],
      3: ['1-2','3-4','5','6-7','8-9'],
      4: ['1-2','3','4','5-6','7','8-9'],
      5: ['1-2','3','4-5','6-7'],
    },
  },
};
const ACTIVE_GRID = 'sj2627';
const SLOTS = GRIDS[ACTIVE_GRID].slots;
// Farbe kommt vom Fach der Klasse (linker Balken)
const SUBJECTS = {
  mathe:     { name: 'Mathe',     bg:'#fdeeee', fg:'#9b2c2c', dot:'#e05a5a' },
  englisch:  { name: 'Englisch',  bg:'#eaf1fc', fg:'#24508f', dot:'#4a7fd4' },
  sonstiges: { name: 'Sonstiges', bg:'#f1f0f4', fg:'#4a4655', dot:'#9a95a6' },
};
const SUBJECT_KEYS = Object.keys(SUBJECTS);
const subj = k => SUBJECTS[k] || SUBJECTS.sonstiges;
const guessSubject = name => /^\s*ma/i.test(name) ? 'mathe' : /^\s*e/i.test(name) ? 'englisch' : 'sonstiges';
const classSubj = c => subj(c && c.subject);
// Planungsstand einer Stunde: '' (offen, weiß) · 'wip' (gelb) · 'done' (grün)
const STATUS = { '': 'offen', wip: 'drucken', done: 'fertig geplant' };
const STATUS_NEXT = { '': 'wip', wip: 'done', done: '' };
// Leistungsnachweis
const EXAMS = { test: 'Test', ka: 'Klassenarbeit' };
const EXAM_SHORT = { test: 'Test', ka: 'KA' };

// =====================================================================
//  DATUM-HELFER (lokale Daten als 'YYYY-MM-DD')
// =====================================================================
const pad = n => String(n).padStart(2,'0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate()+n); return iso(d); };
const dow = s => parse(s).getDay();
const mondayOf = s => { const w = dow(s); return addDays(s, w === 0 ? -6 : 1 - w); };
const ddmm = s => { const d = parse(s); return `${pad(d.getDate())}.${pad(d.getMonth()+1)}.`; };
const ddmmyyyy = s => ddmm(s) + parse(s).getFullYear();
const fmtDay = s => `${DAY_SHORT[dow(s)]} ${ddmm(s)}`;
const todayIso = () => iso(new Date());
function isoWeek(s) {
  const d = parse(s); d.setDate(d.getDate() + 3 - ((d.getDay() + 6) % 7));
  const w1 = new Date(d.getFullYear(), 0, 4);
  return 1 + Math.round(((d - w1) / 86400000 - 3 + ((w1.getDay() + 6) % 7)) / 7);
}
const slotLabel = id => id.replace('-', '/');
const periods = id => { const [a,b] = id.split('-').map(Number); return [a, b || a]; };
const keyOf = (date, slot) => `${date}|${slot}`;
const dateOf = key => key.split('|')[0];
const slotOf = key => key.split('|')[1];
const fmtKey = key => `${fmtDay(dateOf(key))} · ${slotLabel(slotOf(key))}`;
function keyCmp(a, b) {
  const da = dateOf(a), db = dateOf(b);
  if (da !== db) return da < db ? -1 : 1;
  const w = dow(da);
  return SLOTS[w].indexOf(slotOf(a)) - SLOTS[w].indexOf(slotOf(b));
}
function allWeeks() { const out = []; for (let m = START; m <= END; m = addDays(m, 7)) out.push(m); return out; }
const lastWeek = () => mondayOf(END);
function weekdayRange(from, to, label, target) {
  for (let d = from; d <= to; d = addDays(d, 1)) { const w = dow(d); if (w >= 1 && w <= 5) target[d] = label; }
  return target;
}
// Ferien aus "Planer 2026 2027.pdf"
// Ferien/freie Tage trägt die Lehrkraft selbst tageweise im Wochenplaner ein
function defaultFreeDays() { return {}; }
// früher automatisch vorbelegte Ferien – werden aus älteren Ständen einmalig entfernt
function legacyHolidays() {
  const f = {};
  weekdayRange('2026-12-21', '2027-01-01', 'Weihnachtsferien', f);
  weekdayRange('2027-02-08', '2027-02-19', 'Winterferien', f);
  weekdayRange('2027-03-24', '2027-04-02', 'Osterferien', f);
  Object.assign(f, { '2027-03-08': 'frei', '2027-05-06': 'Himmelfahrt', '2027-05-07': 'Brückentag', '2027-05-14': 'frei', '2027-05-17': 'Pfingsten', '2027-05-18': 'Pfingsten' });
  return f;
}
const FREE_LABELS = ['Ferien', 'Feiertag', 'Sonstiges'];
const uid = () => 'id' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

// =====================================================================
//  STATE
// =====================================================================
function emptyState() {
  return {
    version: 2,
    grid: 'sj2627',                 // Stundenraster (siehe GRIDS)
    classes: [],                   // {id, name, subject}
    timetables: [{ id: 'tt1', from: START, slots: { 1:{}, 2:{}, 3:{}, 4:{}, 5:{} } }], // slots[tag][slotId] = classId
    units: [],                      // {id, classId, title, start, lessons:[{id,title,note,status,exam}]}
    placements: {},                 // 'YYYY-MM-DD|slot' -> lessonId
    freeDays: defaultFreeDays(),
    cancelled: {},                  // 'YYYY-MM-DD|slot' -> Grund
    // Vertretungen: 'YYYY-MM-DD|slot' -> { classId } (eigene Klasse, Stunde liegt in placements)
    //                                 oder { label, topic, note } (fremde Klasse)
    subs: {},
    weekNotes: {}, weekEvents: {},
    view: 'week', week: START, classFilter: 'all',
  };
}
const mkLesson = t => ({ id: uid(), title: t, note: '', status: '', exam: /^test$/i.test(t) ? 'test' : /klassenarbeit/i.test(t) ? 'ka' : '' });
function mkUnit(classId, title, titles, start) {
  return { id: uid(), classId, title, start: start || '', lessons: titles.map(mkLesson) };
}
let state = emptyState();
function save() { try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) {} }
function load() {
  let raw = null;
  try { raw = localStorage.getItem(STORE_KEY); } catch (e) {}
  // ohne gespeicherten Stand startet der Planer leer
  state = emptyState();
  if (raw) {
    try { state = Object.assign(emptyState(), JSON.parse(raw)); } catch (e) {}
    fitToGrid();   // Einträge aus älteren Rastern auf das aktive Raster übertragen
  }
  state.grid = ACTIVE_GRID;
  delete state.gridChosen;
  if (!state.legacyHolidaysRemoved) {
    const old = legacyHolidays();
    Object.keys(state.freeDays).forEach(d => { if (old[d] === state.freeDays[d]) delete state.freeDays[d]; });
    state.legacyHolidaysRemoved = true;
  }
  // ältere Stände: Farbe pro Klasse/Reihe → Fach pro Klasse
  state.classes.forEach(c => { if (!c.subject) c.subject = guessSubject(c.name); });
  state.units.forEach(u => u.lessons.forEach(l => { if (l.status === undefined) l.status = ''; if (l.exam === undefined) l.exam = ''; }));
  // ältere Stände: Termine als reiner Text → { d: Datum (leer = ganze Woche), t: Text }
  Object.values(state.weekEvents).forEach(list => list.forEach((e, i) => { if (typeof e === 'string') list[i] = { d: '', t: e }; }));
  if (state.week < START || state.week > lastWeek()) state.week = START;
  if (state.classFilter !== 'all' && !state.classes.find(c => c.id === state.classFilter)) state.classFilter = 'all';
}

// ---------- Lookups ----------
const classById = id => state.classes.find(c => c.id === id);
const className = id => (classById(id) || { name: '–' }).name;
function lessonInfo(lessonId) {
  for (const u of state.units) {
    const idx = u.lessons.findIndex(l => l.id === lessonId);
    if (idx >= 0) return { unit: u, lesson: u.lessons[idx], idx };
  }
  return null;
}
function placedMap() { const m = {}; for (const [k, id] of Object.entries(state.placements)) m[id] = k; return m; }
function unitStats(u, placed = placedMap()) {
  const keys = u.lessons.map(l => placed[l.id]).filter(Boolean).sort(keyCmp);
  return { placed: keys.length, total: u.lessons.length, first: keys[0], last: keys[keys.length - 1] };
}
const unitVars = u => { const c = classSubj(classById(u.classId)); return `--u-bg:${c.bg};--u-fg:${c.fg};--u-dot:${c.dot}`; };
const statusDot = (l, onclick) => `<button class="st-dot ${l.status || 'open'}" title="Planungsstand: ${STATUS[l.status || '']} (klicken zum Wechseln)" ${onclick ? `onclick="${onclick}"` : ''}></button>`;
const examBadge = l => l.exam ? `<span class="exam-badge ${l.exam}">${EXAM_SHORT[l.exam]}</span>` : '';
function cycleStatus(e, lessonId) {
  e.stopPropagation();
  const l = lessonInfo(lessonId).lesson;
  l.status = STATUS_NEXT[l.status || ''];
  save(); if (popOpen) closePop(); render();
}
function setLessonField(lessonId, field, value) { lessonInfo(lessonId).lesson[field] = value; save(); }
function cycleExam(lessonId) { const l = lessonInfo(lessonId).lesson; l.exam = { '': 'test', test: 'ka', ka: '' }[l.exam || '']; save(); render(); }
const visibleClasses = () => state.classFilter === 'all' ? state.classes : state.classes.filter(c => c.id === state.classFilter);
// Einzelstunden (ohne Reihe) sind intern Mini-Reihen mit single:true und genau einer Stunde
const visibleUnits = (singles = false) => state.units.filter(u => !!u.single === singles && (state.classFilter === 'all' || u.classId === state.classFilter));
function addSingle(key, classId, title) {
  title = (title || '').trim();
  if (!title) { showToast('Bitte ein Stundenthema eintragen'); return; }
  if (!classId) { showToast('Bitte eine Klasse wählen'); return; }
  const l = { id: uid(), title, status: '', exam: '', note: '' };
  const u = { id: uid(), title, classId, single: true, start: dateOf(key), lessons: [l] };
  state.units.push(u);
  const prev = state.placements[key];
  state.placements[key] = l.id;
  closePop(); save(); render();
  showToast(prev ? 'Einzelstunde eingetragen – die vorherige Stunde ist wieder offen' : 'Einzelstunde eingetragen');
}
function setLessonTitle(lessonId, v) {
  const info = lessonInfo(lessonId);
  info.lesson.title = v || 'Stunde';
  if (info.unit.single) info.unit.title = info.lesson.title;
  save();
}
function deleteSingle(unitId) {
  const u = unitById(unitId);
  u.lessons.forEach(l => unplace(l.id));
  state.units = state.units.filter(x => x.id !== unitId);
  closePop(); save(); render();
}

// ---------- Stundenplan-Versionen ----------
const sortedTT = () => state.timetables.slice().sort((a, b) => a.from < b.from ? -1 : 1);
function ttFor(date) { let t = null; for (const x of sortedTT()) if (x.from <= date) t = x; return t || sortedTT()[0]; }
function ttUntil(tt) { const s = sortedTT(); const i = s.indexOf(tt); return s[i + 1] ? addDays(s[i + 1].from, -1) : END; }
function classAt(date, slot) { const t = ttFor(date); return ((t.slots[dow(date)] || {})[slot]) || null; }
const hasAnyTimetable = () => state.timetables.some(t => Object.values(t.slots).some(d => Object.keys(d).length));

// Verfügbare Slots einer Klasse (ohne freie Tage / Ausfälle) in zeitlicher Reihenfolge
function classSlots(classId, from = START, to = END) {
  const out = [];
  for (let d = from; d <= to; d = addDays(d, 1)) {
    const w = dow(d);
    if (w < 1 || w > 5 || state.freeDays[d]) continue;
    const day = ttFor(d).slots[w] || {};
    for (const s of SLOTS[w]) {
      const k = keyOf(d, s);
      const sub = state.subs[k];
      if (sub) { if (sub.classId === classId) out.push(k); continue; }   // Vertretung belegt den Slot
      if (day[s] === classId && !state.cancelled[k]) out.push(k);
    }
  }
  return out;
}
// Klasse, deren Stunde in placements[key] liegt (Vertretung vor Stundenplan)
function slotOwner(key) {
  const sub = state.subs[key];
  if (sub) return sub.classId || null;
  return state.cancelled[key] ? null : classAt(dateOf(key), slotOf(key));
}
const subOwn = key => !!(state.subs[key] && state.subs[key].classId);
// fixierte Stunde (z. B. Klassenarbeit) – bleibt beim Nachrücken an ihrem Platz
const isPinnedAt = k => { const id = state.placements[k]; const i = id && lessonInfo(id); return !!(i && i.lesson.pinned); };

// =====================================================================
//  KERNLOGIK
// =====================================================================
// Legt "carries" in die Slot-Folge S; belegte Slots rücken mit, bis eine Lücke den Überhang aufnimmt.
function shiftInto(S, carries) {
  const queue = [...carries];
  for (const k of S) {
    if (!queue.length) break;
    if (isPinnedAt(k)) { queue.forEach(id => crossedPins.add(id)); continue; }   // fixierte Termine werden übersprungen
    if (state.placements[k]) queue.push(state.placements[k]);
    state.placements[k] = queue.shift();
  }
  return queue;
}
const crossedPins = new Set();   // Stunden, die beim Nachrücken hinter einen fixierten Termin gerutscht sind
function reportOverflow(rest) {
  if (rest.length) showToast(`${rest.length} Stunde(n) passen nicht mehr ins Schuljahr → wieder „in Vorbereitung“`);
  else if (crossedPins.size) {
    const t = [...crossedPins].map(id => lessonInfo(id)).filter(Boolean).map(i => `„${i.lesson.title}“`);
    showToast(`📌 ${t.join(', ')} liegt jetzt hinter dem fixierten Termin – bitte prüfen`);
  }
  crossedPins.clear();
}
const lessonClass = id => { const i = lessonInfo(id); return i ? i.unit.classId : null; };

function planInsert(unitId, startDate, redistribute) {
  const u = state.units.find(x => x.id === unitId);
  const placed = placedMap();
  const temp = { ...state.placements };
  if (redistribute) u.lessons.forEach(l => { if (placed[l.id] && !l.pinned) delete temp[placed[l.id]]; });
  const todo = u.lessons.filter(l => redistribute ? !(l.pinned && placed[l.id]) : !placed[l.id]);
  const free = classSlots(u.classId, startDate).filter(k => !temp[k]);
  return { unit: u, temp, assign: todo.map((l, i) => ({ lesson: l, key: free[i] || null })) };
}
function placeUnit(unitId, startDate, redistribute) {
  const p = planInsert(unitId, startDate, redistribute);
  state.placements = p.temp;
  p.unit.start = startDate;
  let n = 0;
  p.assign.forEach(a => { if (a.key) { state.placements[a.key] = a.lesson.id; n++; } });
  return n;
}

function moveLesson(lessonId, targetKey) {
  const placed = placedMap();
  const src = placed[lessonId];
  if (src === targetKey) return;
  if ((state.cancelled[targetKey] && !subOwn(targetKey)) || state.freeDays[dateOf(targetKey)]) return;
  if (state.subs[targetKey] && !subOwn(targetKey)) return;
  const existing = state.placements[targetKey];
  if (existing && isPinnedAt(targetKey)) { showToast('Dort liegt ein fixierter Termin – erst lösen (📌)'); return; }
  if (src) delete state.placements[src];
  state.placements[targetKey] = lessonId;
  if (existing) {
    if (src) state.placements[src] = existing;
    else showToast('Die vorherige Stunde ist wieder „in Vorbereitung“');
  }
}
function unplace(lessonId) { const src = placedMap()[lessonId]; if (src) delete state.placements[src]; }
function moveStep(lessonId, dir) {
  const src = placedMap()[lessonId];
  if (!src) return;
  const all = classSlots(lessonClass(lessonId)).filter(k => !isPinnedAt(k));
  const target = dir > 0 ? all.find(k => keyCmp(k, src) > 0) : [...all].reverse().find(k => keyCmp(k, src) < 0);
  if (!target) { showToast('Keine weitere Stunde dieser Klasse in dieser Richtung'); return; }
  moveLesson(lessonId, target);
  closePop(); save(); render();
  showToast(`→ ${fmtKey(target)}`);
}
function cancelSlot(key, reason, mode) {
  if (state.subs[key]) { showToast('In dieser Stunde liegt eine Vertretung – erst entfernen'); return; }
  const lessonId = state.placements[key];
  delete state.placements[key];
  state.cancelled[key] = reason || 'Ausfall';
  if (lessonId && mode === 'shift') {
    const c = lessonClass(lessonId);
    reportOverflow(shiftInto(classSlots(c, dateOf(key)).filter(k => keyCmp(k, key) > 0), [lessonId]));
  }
  closePop(); save(); render();
}
// Folgestunden ab key je einen Slot nach vorn ziehen (bis zur ersten Lücke); fixierte bleiben stehen
// Fixierte Termine sind eine Grenze: Stunden danach werden nicht vor die Klassenarbeit gezogen.
function pullForward(classId, key) {
  const S = classSlots(classId, dateOf(key)).filter(k => keyCmp(k, key) >= 0);
  if (S[0] !== key || state.placements[key]) return;
  for (let i = 0; i < S.length - 1; i++) {
    if (isPinnedAt(S[i + 1])) break;
    const next = state.placements[S[i + 1]];
    if (!next) break;
    state.placements[S[i]] = next;
    delete state.placements[S[i + 1]];
  }
}
function uncancel(key, pullBack) {
  if (state.subs[key]) { showToast('Erst die Vertretung in dieser Stunde entfernen'); return; }
  delete state.cancelled[key];
  const c = classAt(dateOf(key), slotOf(key));
  if (pullBack && c) pullForward(c, key);
  closePop(); save(); render();
}
function setFreeDay(date, label, shift) {
  const byClass = {};
  SLOTS[dow(date)].map(s => keyOf(date, s)).filter(k => state.placements[k]).forEach(k => {
    const id = state.placements[k]; delete state.placements[k];
    const c = lessonClass(id); (byClass[c] = byClass[c] || []).push(id);
  });
  state.freeDays[date] = label || 'frei';
  if (shift) {
    let rest = [];
    for (const [c, ids] of Object.entries(byClass)) rest = rest.concat(shiftInto(classSlots(c, addDays(date, 1)), ids));
    reportOverflow(rest);
  }
  closePop(); save(); render();
}
function unsetFreeDay(date) { delete state.freeDays[date]; closePop(); save(); render(); }
// ganze Woche frei: Stunden rücken je Klasse hinter die Woche
function setFreeWeek(mon, label) {
  const byClass = {};
  for (let i = 0; i < 5; i++) {
    const d = addDays(mon, i);
    SLOTS[dow(d)].map(s => keyOf(d, s)).filter(k => state.placements[k]).sort(keyCmp).forEach(k => {
      const id = state.placements[k]; delete state.placements[k];
      const c = lessonClass(id); (byClass[c] = byClass[c] || []).push(id);
    });
    state.freeDays[d] = label || 'Ferien';
  }
  let rest = [];
  for (const [c, ids] of Object.entries(byClass)) rest = rest.concat(shiftInto(classSlots(c, addDays(mon, 7)), ids));
  reportOverflow(rest);
  closePop(); save(); render();
}

// Einträge mit Stunden, die es im aktiven Raster nicht (mehr) gibt, auf die zeitlich passende Stunde übertragen
function fitToGrid() {
  const overlaps = (a, b) => { const [a1, a2] = periods(a), [b1, b2] = periods(b); return a1 <= b2 && b1 <= a2; };
  state.timetables.forEach(t => {
    for (let d = 1; d <= 5; d++) {
      const day = t.slots[d] = t.slots[d] || {};
      Object.keys(day).filter(s => !SLOTS[d].includes(s)).forEach(s => {
        const c = day[s]; delete day[s];
        SLOTS[d].filter(n => overlaps(s, n) && !day[n]).forEach(n => { day[n] = c; });
      });
    }
  });
  const mapKey = k => {
    const d = dateOf(k), w = dow(d), s = slotOf(k);
    if (w < 1 || w > 5 || SLOTS[w].includes(s)) return k;
    const ns = SLOTS[w].find(n => overlaps(s, n));
    return ns ? keyOf(d, ns) : null;
  };
  const np = {}, nc = {};
  Object.entries(state.placements).filter(([k]) => mapKey(k) === k).forEach(([k, id]) => { np[k] = id; });
  Object.entries(state.placements).filter(([k]) => mapKey(k) !== k).sort((a, b) => a[0] < b[0] ? -1 : 1)
    .forEach(([k, id]) => { const nk = mapKey(k); if (nk && !np[nk]) np[nk] = id; });   // sonst: zurück in die Reihe
  Object.entries(state.cancelled).forEach(([k, v]) => { const nk = mapKey(k); if (nk) nc[nk] = v; });
  state.placements = np; state.cancelled = nc;
}

// Nach Stundenplanwechsel: alle Stunden ab "from" je Klasse der Reihe nach auf die neuen Slots verteilen
function reflowFrom(from) {
  const byClass = {};
  Object.entries(state.placements).filter(([k]) => dateOf(k) >= from).sort((a, b) => keyCmp(a[0], b[0])).forEach(([k, id]) => {
    const c = lessonClass(id);
    // fixierte Termine bleiben, solange die Klasse dort weiterhin Unterricht hat
    if (isPinnedAt(k) && c && classSlots(c, dateOf(k), dateOf(k)).includes(k)) return;
    delete state.placements[k];
    if (!c) return;
    (byClass[c] = byClass[c] || []).push(id);
  });
  let lost = 0;
  for (const [c, ids] of Object.entries(byClass)) {
    const S = classSlots(c, from).filter(k => !state.placements[k]);
    ids.forEach((id, i) => { if (S[i]) state.placements[S[i]] = id; else lost++; });
  }
  return lost;
}

// =====================================================================
//  RENDER
// =====================================================================
// ---------- Kacheln der Wochenansicht ----------
const classTag = c => c ? `<span class="ctag"><span class="cdot" style="background:${classSubj(c).dot}"></span>${escHtml(c.name)}</span>` : '';
const SUB_BADGE = `<span class="sub-badge" title="Vertretung">Vertr.</span>`;
function lessonChip(lessonId, s, isSub) {
  const info = lessonInfo(lessonId), l = info.lesson;
  const pin = l.exam || l.pinned ? `<button class="pin-btn ${l.pinned ? 'on' : ''}" onclick="togglePin(event,'${lessonId}')" title="${l.pinned ? 'Fixiert – bleibt beim Verschieben stehen (lösen)' : 'Termin fixieren'}">📌</button>` : '';
  return `<div class="chip st-${l.status || 'open'} ${l.exam ? 'has-exam' : ''} ${l.pinned ? 'pinned' : ''}" style="${unitVars(info.unit)}" draggable="true" ondragstart="dragStart(event,'lesson','${lessonId}')" onclick="lessonClick(event,'${lessonId}')">
    <span class="chip-no">${slotLabel(s)}</span>${pin}
    <span class="chip-meta">${isSub ? SUB_BADGE : ''}${examBadge(l)}<b>${escHtml(className(info.unit.classId))}</b>${info.unit.single ? '' : ` · ${escHtml(info.unit.title)} ${info.idx + 1}/${info.unit.lessons.length}`}</span>
    <span class="chip-title">${escHtml(l.title)}</span></div>`;
}
function slotCell(key, s, cId, pos) {
  const lessonId = state.placements[key];
  const c = cId && classById(cId);
  let classes = 'slot ' + (c ? 'cls' : 'other');
  let inner = `<span class="slot-no">${slotLabel(s)}</span>`;
  if (state.cancelled[key]) {
    classes += ' cancelled';
    inner += `${classTag(c)}<span class="cancel-tag">✕ ${escHtml(state.cancelled[key])}</span>`;
  } else if (lessonId && lessonInfo(lessonId)) {
    classes += ' filled droppable';
    inner += lessonChip(lessonId, s);
  } else {
    classes += ' droppable';
    if (c) inner += `${classTag(c)}<span class="slot-empty">noch nicht geplant</span>`;
  }
  return `<div class="${classes}" style="${pos}" data-key="${key}" onclick="slotClick(event,'${key}')">${inner}</div>`;
}
function subCell(key, s, full) {
  const sub = state.subs[key];
  const no = `<span class="slot-no">${slotLabel(s)}</span>`;
  if (sub.classId) {
    const lessonId = state.placements[key];
    if (lessonId && lessonInfo(lessonId)) return `<div class="slot filled droppable sub" data-key="${key}" onclick="slotClick(event,'${key}')">${lessonChip(lessonId, s, true)}</div>`;
    return `<div class="slot cls droppable sub" data-key="${key}" onclick="slotClick(event,'${key}')">${no}<span class="sub-stack">${SUB_BADGE}${classTag(classById(sub.classId))}<span class="slot-empty">noch nicht geplant</span></span></div>`;
  }
  return `<div class="slot filled sub" data-key="${key}" onclick="subClick(event,'${key}')"><div class="chip sub-foreign">
    <span class="chip-no">${slotLabel(s)}</span>
    <span class="chip-meta">${SUB_BADGE}<b>${escHtml(sub.label || 'Vertretung')}</b></span>
    <span class="chip-title">${sub.topic ? escHtml(sub.topic) : '<i class="muted">Thema eintragen…</i>'}</span></div></div>`;
}

function render() {
  document.querySelectorAll('#viewSeg button').forEach(b => b.classList.toggle('active', b.dataset.view === state.view));
  document.getElementById('classSeg').innerHTML =
    `<button class="${state.classFilter === 'all' ? 'active' : ''}" onclick="setClassFilter('all')">Alle Klassen</button>` +
    state.classes.map(c => `<button class="${state.classFilter === c.id ? 'active' : ''}" onclick="setClassFilter('${c.id}')"><span class="cdot" style="background:${classSubj(c).dot}"></span>${escHtml(c.name)}</button>`).join('');
  const main = document.getElementById('main');
  if (state.view === 'year') main.innerHTML = renderYear();
  else if (state.view === 'units') main.innerHTML = renderUnits();
  else main.innerHTML = renderWeek();
  bindDnD();
  syncHeaderHeight();
}
function setView(v) { state.view = v; closePop(); save(); render(); window.scrollTo(0, 0); }
function setClassFilter(id) { state.classFilter = id; closePop(); save(); render(); }

function setupBanner() {
  if (!state.classes.length) return `<div class="banner"><div><b>Los geht's:</b> Lege zuerst deine Klassen an und trage sie in den Stundenplan ein.</div><div class="spacer"></div><button class="btn primary" onclick="openTimetable()">Klassen anlegen</button></div>`;
  if (!hasAnyTimetable()) return `<div class="banner"><div><b>Stundenplan fehlt:</b> Trage ein, wann du welche Klasse hast – dann landen Reihen automatisch in den richtigen Stunden.</div><div class="spacer"></div><button class="btn primary" onclick="openTimetable()">Stundenplan festlegen</button></div>`;
  return '';
}

// ---------- Wochenplaner ----------
function renderWeek() {
  const placed = placedMap();
  const mon = state.week, fri = addDays(mon, 4);
  const weeks = allWeeks();
  const wIdx = weeks.indexOf(mon);
  const today = todayIso();

  // Sidebar: Reihen der gefilterten Klassen
  // nur Reihen mit noch nicht eingeplanten Stunden; komplett eingetragene verschwinden
  const openUnits = visibleUnits().filter(u => unitStats(u, placed).placed < u.lessons.length);
  let side = `<div class="side-title"><span class="muted" style="font-size:12px">offene Stunden zum Einplanen</span><button class="add-btn" onclick="openNewUnit()">＋ Reihe</button></div>`;
  const vc = visibleClasses();
  const openSingles = visibleUnits(true).filter(u => !placed[u.lessons[0].id]);
  if (!openUnits.length && !openSingles.length) side += `<div class="card" style="padding:12px;font-size:12.5px;color:var(--text2)">Alle Reihen sind vollständig im Planer. Neue Reihen oder zurückgestellte Stunden erscheinen hier.</div>`;
  vc.forEach(c => {
    const units = openUnits.filter(u => u.classId === c.id);
    const singles = openSingles.filter(u => u.classId === c.id);
    if (!units.length && !singles.length) return;
    if (vc.length > 1) side += `<div class="side-class"><span class="cdot" style="background:${classSubj(c).dot}"></span>${escHtml(c.name)}</div>`;
    units.forEach(u => {
      const st = unitStats(u, placed);
      const unpl = u.lessons.map((l, i) => ({ l, i })).filter(x => !placed[x.l.id]);
      side += `<div class="unit-side" style="${unitVars(u)}">
        <div class="us-head" draggable="true" ondragstart="dragStart(event,'unit','${u.id}')" title="Auf eine Stunde ziehen = ab diesem Tag übertragen">
          <span class="dot"></span><b>${escHtml(u.title)}</b><span class="us-count">${st.placed}/${st.total}</span></div>
        <div class="progress"><i style="width:${st.total ? st.placed / st.total * 100 : 0}%"></i></div>
        <div class="us-meta">${st.placed ? `${fmtDay(dateOf(st.first))} – ${fmtDay(dateOf(st.last))}` : 'in Vorbereitung · kein Datum'}</div>
        ${unpl.length && st.placed ? `<div class="unplaced">${unpl.map(x => `<span class="mini-chip" draggable="true" ondragstart="dragStart(event,'lesson','${x.l.id}')" title="${escAttr(x.l.title)}">${x.i + 1}. ${escHtml(x.l.title)}</span>`).join('')}</div>` : ''}
        ${unpl.length ? `<div class="us-actions"><button class="btn small primary" onclick="openInsert('${u.id}')">${st.placed ? 'Rest übertragen…' : 'Startdatum festlegen…'}</button></div>` : ''}
      </div>`;
    });
    if (singles.length) side += `<div class="unit-side single-side"><div class="us-meta">Einzelstunden ohne Termin – auf eine Stunde ziehen</div><div class="unplaced">${singles.map(u =>
      `<span class="mini-chip" style="${unitVars(u)}" draggable="true" ondragstart="dragStart(event,'lesson','${u.lessons[0].id}')" title="${escAttr(u.title)}">${escHtml(u.title)}<button class="chip-btn" onclick="deleteSingle('${u.id}')" title="Einzelstunde löschen">✕</button></span>`).join('')}</div></div>`;
  });

  // Grid
  let g = `<div></div>`;
  for (let d = 1; d <= 5; d++) {
    const date = addDays(mon, d - 1);
    const exams = SLOTS[d].map(s => state.placements[keyOf(date, s)]).filter(Boolean).map(lessonInfo).filter(i => i && i.lesson.exam);
    const evs = eventsOn(date);
    g += `<div class="day-head ${date === today ? 'today' : ''}" style="grid-column:${d + 1}" onclick="dayClick(event,'${date}')" title="Tag ausblocken (Ferien, Feiertag …)"><span class="dn">${DAY_FULL[d]}</span><span class="dd">${ddmm(date)}</span>
      ${evs.length ? `<span class="ev-mark" title="${escAttr(evs.map(x => x.t).join(' · '))}">${escHtml(evs.map(x => x.t).join(' · '))}</span>` : ''}
      ${exams.map(i => `<span class="exam-badge ${i.lesson.exam}" title="${EXAMS[i.lesson.exam]}">${EXAM_SHORT[i.lesson.exam]} ${escHtml(className(i.unit.classId))}</span>`).join('')}</div>`;
  }
  for (let p = 1; p <= 9; p++) g += `<div class="period-no" style="grid-row:${p + 1}">${p}</div>`;
  for (let d = 1; d <= 5; d++) {
    const date = addDays(mon, d - 1);
    if (state.freeDays[date]) {
      g += `<div class="free-day" style="grid-column:${d + 1}" onclick="dayClick(event,'${date}')">${escHtml(state.freeDays[date])}</div>`;
      continue;
    }
    SLOTS[d].forEach(s => {
      const [a, b] = periods(s);
      const key = keyOf(date, s);
      const pos = `grid-column:${d + 1};grid-row:${a + 1}/${b + 2}`;
      const cId = classAt(date, s);
      const sub = state.subs[key];
      if (sub) {
        // Vertretung: bei ausgefallener eigener Klasse geteilt (links Ausfall, rechts Vertretung)
        const left = cId && state.cancelled[key]
          ? `<div class="slot cls cancelled half" onclick="slotClick(event,'${key}')"><span class="slot-no">${slotLabel(s)}</span>${classTag(classById(cId))}<span class="cancel-tag">✕ ${escHtml(state.cancelled[key])}</span></div>` : '';
        g += `<div class="slot-split ${left ? 'two' : ''}" style="${pos}">${left}${subCell(key, s, !left)}</div>`;
        return;
      }
      g += slotCell(key, s, cId, pos);
    });
  }

  // Seitenleiste mit Reitern: Reihen · Notizen · Termine
  const events = state.weekEvents[mon] || [];
  const hasNote = !!(state.weekNotes[mon] || '').trim();
  const panels = [
    ['units', 'Reihen', openUnits.length + openSingles.length ? `<b>${openUnits.length + openSingles.length}</b>` : ''],
    ['notes', 'Notizen', hasNote ? '<b class="dotmark"></b>' : ''],
    ['events', 'Termine', events.length ? `<b>${events.length}</b>` : ''],
  ];
  const panel = state.sidePanel;
  let sideHtml;
  if (!panel) {
    sideHtml = panels.map(([id, label, badge]) => `<button class="side-tab" onclick="openPanel('${id}')" title="${label} öffnen"><span>${label}</span>${badge}</button>`).join('');
  } else {
    sideHtml = `<div class="panel-tabs">${panels.map(([id, label, badge]) => `<button class="${id === panel ? 'active' : ''}" onclick="openPanel('${id}')" title="${id === panel ? 'Einklappen' : label}">${label}${badge}</button>`).join('')}</div>`;
    if (panel === 'units') sideHtml += side;
    else if (panel === 'notes') sideHtml += `<div class="panel-sub">Notizen · ${ddmm(mon)} – ${ddmm(fri)}</div>
      <textarea class="notes-area panel-notes" placeholder="Notizen zur Woche…" oninput="state.weekNotes['${mon}']=this.value; save()">${escHtml(state.weekNotes[mon] || '')}</textarea>`;
    else sideHtml += `<div class="panel-sub">Termine · ${ddmm(mon)} – ${ddmm(fri)}</div>
      <div data-list="${mon}">${eventList(mon)}</div><div><button class="add-btn" onclick="addEvent('${mon}')">＋ Termin</button></div>`;
  }

  const tt = ttFor(mon);
  const ttChange = sortedTT().find(t => t.from > mon && t.from <= fri);
  return `${setupBanner()}
  <div class="week-layout ${panel ? '' : 'collapsed'}">
    <aside class="sidebar" id="sidebar">${sideHtml}</aside>
    <section>
      <div class="week-nav">
        <h2>${ddmm(mon)} – ${ddmmyyyy(fri)}</h2>
        <span class="kw">KW ${isoWeek(mon)} · Woche ${wIdx + 1}/${weeks.length}</span>
        <div class="spacer"></div>
        <button class="btn" onclick="gotoToday()">Heute</button>
        <label class="date-jump" title="Zu einem Datum springen">📅 <input type="date" min="${START}" max="${END}" value="${mon}" onchange="if(this.value) jumpToDate(this.value)"></label>
      </div>
      <div class="tt-note">Stundenplan ab ${ddmmyyyy(tt.from)}${ttChange ? ` · <b style="color:var(--accent)">ab ${fmtDay(ttChange.from)} gilt ein neuer Stundenplan</b>` : ''}</div>
      <div class="week-stage">
      <button class="side-arrow left" id="navPrev" onclick="gotoWeek(${wIdx - 1})" ${wIdx <= 0 ? 'disabled' : ''} title="Vorherige Woche (Stunde hierher ziehen zum Blättern)">‹</button>
      <button class="side-arrow right" id="navNext" onclick="gotoWeek(${wIdx + 1})" ${wIdx >= weeks.length - 1 ? 'disabled' : ''} title="Nächste Woche (Stunde hierher ziehen zum Blättern)">›</button>
      <div class="card week-card"><div class="week-grid" id="weekGrid">${g}</div>
        <div class="legend">
          <span><i style="background:${SUBJECTS.mathe.dot}"></i>Mathe</span>
          <span><i style="background:${SUBJECTS.englisch.dot}"></i>Englisch</span>
          <span><i style="background:white;border:1px solid var(--border2)"></i>offen</span>
          <span><i style="background:var(--wip-bg);border:1px solid var(--wip-dot)"></i>drucken</span>
          <span><i style="background:var(--done-bg);border:1px solid var(--done-dot)"></i>fertig geplant</span>
          <span class="exam-badge ka" style="margin:0">KA</span><span class="exam-badge test" style="margin:0 6px 0 -8px">Test</span>
          <span><i style="background:var(--free-bg)"></i>kein Unterricht</span>
          <span><i style="background:var(--cancel-bg);border:1px solid #f0cbd7"></i>Ausfall</span>        </div>
      </div>
      </div>
    </section>
  </div>`;
}
// Kopfzeile kann auf dem iPad zweizeilig werden → Höhe für sticky-Elemente merken
function syncHeaderHeight() { document.documentElement.style.setProperty('--hh', document.querySelector('.header').offsetHeight + 'px'); fitWeekGrid(); }
// Zeilenhöhe so wählen, dass der ganze Wochenplan (inkl. Legende) ohne Scrollen ins Fenster passt
function fitWeekGrid() {
  const grid = document.getElementById('weekGrid');
  if (!grid) return;
  const card = grid.closest('.week-card');
  const head = grid.querySelector('.day-head');
  const legend = card.querySelector('.legend');
  const gap = parseFloat(getComputedStyle(grid).rowGap) || 0;
  const top = grid.getBoundingClientRect().top + window.scrollY;
  const below = (legend ? legend.offsetHeight + parseFloat(getComputedStyle(legend).marginTop) : 0)
              + parseFloat(getComputedStyle(card).paddingBottom) + 14;
  const avail = window.innerHeight - top - head.offsetHeight - gap * 9 - below;
  const h = Math.max(30, Math.min(64, Math.floor(avail / 9)));
  grid.style.setProperty('--row-h', h + 'px');
  grid.classList.toggle('compact', h < 44);
}
window.addEventListener('resize', syncHeaderHeight);
function jumpToDate(d) {
  let m = mondayOf(d); if (m < START) m = START; if (m > lastWeek()) m = lastWeek();
  state.week = m; closePop(); save(); render();
}
function openPanel(p) {
  state.sidePanel = state.sidePanel === p ? null : p;
  closePop(); save(); render();
  if (state.sidePanel === 'notes') setTimeout(() => { const t = document.querySelector('.panel-notes'); if (t) t.focus(); }, 10);
}
function gotoWeek(i) { const w = allWeeks(); if (i < 0 || i >= w.length) return; state.week = w[i]; closePop(); save(); render(); }
function gotoWeekOf(date) { state.week = mondayOf(date); state.view = 'week'; closePop(); save(); render(); window.scrollTo(0, 0); }
function gotoToday() { let m = mondayOf(todayIso()); if (m < START) m = START; if (m > lastWeek()) m = lastWeek(); state.week = m; save(); render(); }

// ---------- Jahresplanung ----------
function renderYear() {
  const placed = placedMap();
  const vc = visibleClasses();
  let pal = `<div class="card palette"><b style="font-size:13px;margin-right:4px">In Vorbereitung</b>`;
  const prep = visibleUnits().filter(u => unitStats(u, placed).placed < u.lessons.length);
  prep.forEach(u => {
    const st = unitStats(u, placed);
    pal += `<span class="pal-chip" style="${unitVars(u)}" draggable="true" ondragstart="dragStart(event,'unit','${u.id}')"><span class="dot"></span>${escHtml(u.title)} <small>${escHtml(className(u.classId))} · ${st.placed}/${st.total}</small></span>`;
  });
  if (!prep.length) pal += `<span class="muted" style="font-size:12px">alle Reihen sind im Planer</span>`;
  pal += `<button class="add-btn" onclick="openNewUnit()">＋ Reihe</button><span class="hint">Reihe auf eine Woche ziehen → Startdatum = Montag dieser Woche</span></div>`;

  const curMon = mondayOf(todayIso());
  const ttFroms = sortedTT().map(t => t.from).filter(f => f > START);
  // alle Platzierungen einmal sortiert
  const entries = Object.entries(state.placements).sort((a, b) => keyCmp(a[0], b[0]));
  let rows = '';
  allWeeks().forEach((mon, wi) => {
    const fri = addDays(mon, 4);
    // freie Tage der Woche: ganze Woche → ein Badge, sonst pro Tag mit Wochentag
    const freeDates = [0, 1, 2, 3, 4].map(i => addDays(mon, i)).filter(d => state.freeDays[d]);
    const freeCount = freeDates.length;
    const labels = [...new Set(freeDates.map(d => state.freeDays[d]))];
    const wholeWeek = freeCount === 5 && labels.length === 1;
    const frees = wholeWeek ? labels : [];
    const ttStart = ttFroms.find(f => f >= mon && f <= fri);
    const inWeek = entries.filter(([k]) => dateOf(k) >= mon && dateOf(k) <= fri);
    let cells = '';
    vc.forEach(c => {
      const groups = new Map();
      inWeek.forEach(([k, id]) => {
        const info = lessonInfo(id); if (!info || info.unit.classId !== c.id) return;
        if (!groups.has(info.unit.id)) groups.set(info.unit.id, { unit: info.unit, items: [] });
        groups.get(info.unit.id).items.push({ k, info });
      });
      const slots = classSlots(c.id, mon, fri);
      const used = slots.filter(k => state.placements[k]).length;
      let html = slots.length ? `<div class="yc-head"><span class="cap ${used === slots.length ? 'full' : ''}">${used}/${slots.length} Std.</span></div>` : '';
      // freie Tage nur bei Klassen zeigen, die an diesem Tag laut Stundenplan Unterricht hätten
      const classFrees = wholeWeek ? frees
        : freeDates.filter(d => SLOTS[dow(d)].some(s => classAt(d, s) === c.id)).map(d => `${DAY_SHORT[dow(d)]} ${ddmm(d)} · ${state.freeDays[d]}`);
      html += classFrees.map(f => `<span class="free-badge">${escHtml(f)}</span>`).join('');
      groups.forEach(gr => {
        html += `<div class="yu ${gr.unit.single ? 'single' : ''}" style="${unitVars(gr.unit)}" onclick="gotoWeekOf('${mon}')">${gr.unit.single ? '' : `<b>${escHtml(gr.unit.title)}</b>`}
          ${gr.items.map(it => `<div class="yl ${it.info.lesson.exam ? 'ex' : ''}"><span class="yd">${DAY_SHORT[dow(dateOf(it.k))]}</span>${statusDot(it.info.lesson, `cycleStatus(event,'${it.info.lesson.id}')`)}<span>${examBadge(it.info.lesson)}${escHtml(it.info.lesson.title)}</span></div>`).join('')}</div>`;
      });
      const cx = Object.keys(state.cancelled).filter(k => dateOf(k) >= mon && dateOf(k) <= fri && classAt(dateOf(k), slotOf(k)) === c.id);
      html += cx.map(k => `<div class="yl cx"><span class="yd">${DAY_SHORT[dow(dateOf(k))]}</span><span>✕ ${escHtml(state.cancelled[k])}</span></div>`).join('');
      if (!groups.size && slots.length && !cx.length) html += `<span class="y-empty">noch nicht geplant</span>`;
      cells += `<td data-week="${mon}" data-class="${c.id}">${html}</td>`;
    });
    rows += `<tr class="${freeCount === 5 ? 'holiday' : ''} ${mon === curMon ? 'current' : ''} ${ttStart ? 'tt-change' : ''}">
      <td><div class="wk-label" onclick="gotoWeekOf('${mon}')"><b>${ddmm(mon)} – ${ddmm(fri)}</b><small>KW ${isoWeek(mon)} · Woche ${wi + 1}</small></div>
        ${ttStart ? `<span class="tt-flag">neuer Stundenplan ab ${fmtDay(ttStart)}</span>` : ''}</td>
      ${cells}
      <td><div data-list="${mon}">${eventList(mon)}</div><button class="add-btn" onclick="addEvent('${mon}')">＋ Termin</button></td>
    </tr>`;
  });
  const head = vc.map(c => `<th><span class="ctag"><span class="cdot" style="background:${classSubj(c).dot}"></span>${escHtml(c.name)}</span></th>`).join('');
  return `${setupBanner()}${pal}
    <div class="card"><table class="year-table" id="yearTable">
      <thead><tr><th>Woche</th>${head}<th>Termine</th></tr></thead>
      <tbody>${rows}</tbody></table></div>`;
}

// ---------- Reihen ----------
function unitCard(u, placed) {
  const st = unitStats(u, placed);
  const unpl = st.total - st.placed;
  return `<div class="card unit-card" style="${unitVars(u)}">
    <div class="uc-head"><span class="dot"></span>
      <span class="uc-title" contenteditable="true" onkeydown="handleKey(event)" onblur="renameUnit('${u.id}', this)">${escHtml(u.title)}</span>
      <span class="us-count">${st.placed}/${st.total}</span></div>
    <div class="uc-sub">
      <select onchange="setUnitClass('${u.id}', this.value)">${state.classes.map(c => `<option value="${c.id}" ${c.id === u.classId ? 'selected' : ''}>${escHtml(c.name)}</option>`).join('')}</select>
      ${st.placed ? `<span class="badge live">im Planer</span><span>${fmtDay(dateOf(st.first))} – ${fmtDay(dateOf(st.last))}</span>` : `<span class="badge prep">in Vorbereitung</span><span>${st.total} Stunden, noch ohne Datum</span>`}
    </div>
    <div class="start-row">
      <label>Startdatum</label><input type="date" min="${START}" max="${END}" value="${u.start || ''}" onchange="setUnitStart('${u.id}', this.value)">
      <div class="spacer"></div>
      ${unpl ? `<button class="btn small primary" ${u.start ? '' : 'disabled title="Erst Startdatum wählen"'} onclick="openInsert('${u.id}', '${u.start}')">${st.placed ? `Rest (${unpl}) übertragen…` : 'In Planer übertragen…'}</button>`
             : `<button class="btn small" onclick="openInsert('${u.id}', '${u.start}', true)">Neu verteilen…</button>`}
    </div>
    <ol class="lesson-list">${u.lessons.map((l, i) => {
      const k = placed[l.id];
      return `<li class="lesson-row st-${l.status || 'open'}"><span class="ln">${i + 1}</span>
        <span class="lt-wrap">${statusDot(l, `cycleStatus(event,'${l.id}')`)}<button class="exam-toggle ${l.exam || ''}" title="Kein / Test / Klassenarbeit" onclick="cycleExam('${l.id}')">${l.exam ? EXAM_SHORT[l.exam] : ''}</button>
        <span class="lt" contenteditable="true" onkeydown="handleKey(event)" onblur="renameLesson('${l.id}', this)">${escHtml(l.title)}</span></span>
        <span class="lp ${k ? 'on' : ''}" ${k ? `onclick="gotoWeekOf('${dateOf(k)}')" title="Im Wochenplaner zeigen"` : ''}>${k ? fmtKey(k) : '—'}</span>
        <span class="row-tools"><button title="nach oben" onclick="moveLessonInUnit('${u.id}',${i},-1)">▲</button><button title="nach unten" onclick="moveLessonInUnit('${u.id}',${i},1)">▼</button><button title="Stunde löschen" onclick="deleteLesson('${u.id}','${l.id}')">✕</button></span></li>`;
    }).join('')}</ol>
    <div class="uc-actions">
      <button class="add-btn" onclick="addLesson('${u.id}')">＋ Stunde</button>
      <div class="spacer"></div>
      ${st.placed ? `<button class="btn small" onclick="removeUnitFromPlan('${u.id}')">Aus Planer nehmen</button>` : ''}
      <button class="btn small" onclick="copyUnitMenu(event,'${u.id}')">Kopieren…</button>
      <button class="btn small danger" onclick="deleteUnit('${u.id}')">Löschen</button>
    </div></div>`;
}
function renderUnits() {
  const placed = placedMap();
  const units = visibleUnits();
  const prep = units.filter(u => unitStats(u, placed).placed === 0);
  const live = units.filter(u => unitStats(u, placed).placed > 0);
  return `${setupBanner()}
    <div class="section-title">In Vorbereitung <span class="badge">${prep.length}</span></div>
    <div class="units-grid">${prep.map(u => unitCard(u, placed)).join('')}
      <div class="new-unit-card" onclick="openNewUnit()"><span class="plus">＋</span>Neue Reihe</div></div>
    <div class="section-title">Im Planer <span class="badge">${live.length}</span></div>
    <div class="units-grid">${live.length ? live.map(u => unitCard(u, placed)).join('') : '<div class="muted" style="font-size:13px">Noch keine Reihe übertragen.</div>'}</div>`;
}

// ---------- Termine ----------
// Termine einer Woche, nach Tag sortiert (ohne Tag = ganze Woche, zuerst)
const sortedEvents = mon => (state.weekEvents[mon] || []).map((e, i) => ({ ...e, i })).sort((a, b) => (a.d || '').localeCompare(b.d || ''));
const eventsOn = date => (state.weekEvents[mondayOf(date)] || []).filter(e => e.d === date);
function eventList(mon) {
  return sortedEvents(mon).map(e => `<div class="editable-item">
    <select class="ev-day" onchange="setEventDay('${mon}',${e.i},this.value)" title="Tag des Termins">
      <option value="" ${e.d ? '' : 'selected'}>Woche</option>
      ${[0, 1, 2, 3, 4].map(k => { const d = addDays(mon, k); return `<option value="${d}" ${e.d === d ? 'selected' : ''}>${DAY_SHORT[k + 1]} ${ddmm(d)}</option>`; }).join('')}
    </select>
    <span class="chip-text" contenteditable="true" onkeydown="handleKey(event)" onblur="updateEvent('${mon}',${e.i},this)">${escHtml(e.t)}</span><button class="chip-btn" onclick="deleteEvent('${mon}',${e.i})">✕</button></div>`).join('');
}
// Anzeige ohne Bearbeitung (Jahresplanung)
function eventLabel(e) { return e.d ? `<span class="ev-when">${DAY_SHORT[dow(e.d)]} ${ddmm(e.d)}</span> ${escHtml(e.t)}` : escHtml(e.t); }
function addEvent(mon, date) {
  (state.weekEvents[mon] = state.weekEvents[mon] || []).push({ d: date || '', t: '' });
  const i = state.weekEvents[mon].length - 1;
  save(); render();
  setTimeout(() => { const f = [...document.querySelectorAll(`[data-list="${mon}"] .chip-text`)].find(el => (el.getAttribute('onblur') || '').includes(`,${i},`)); if (f) f.focus(); }, 10);
}
function updateEvent(mon, i, el) {
  const v = el.innerText.trim();
  if (!v) { state.weekEvents[mon].splice(i, 1); save(); render(); return; }
  state.weekEvents[mon][i].t = v; save();
}
function setEventDay(mon, i, d) { state.weekEvents[mon][i].d = d; save(); render(); }
function deleteEvent(mon, i) { state.weekEvents[mon].splice(i, 1); save(); render(); }

// =====================================================================
//  REIHEN-AKTIONEN
// =====================================================================
const unitById = id => state.units.find(x => x.id === id);
function renameUnit(id, el) { unitById(id).title = el.innerText.trim() || 'Reihe'; save(); }
function renameLesson(id, el) { const info = lessonInfo(id); info.lesson.title = el.innerText.trim() || `Stunde ${info.idx + 1}`; save(); }
function setUnitStart(id, v) { unitById(id).start = v; save(); render(); }
function setUnitClass(id, classId) {
  const u = unitById(id);
  const st = unitStats(u);
  if (st.placed && !confirm('Die Reihe ist schon im Planer. Beim Klassenwechsel wird sie aus dem Planer genommen. Fortfahren?')) { render(); return; }
  u.lessons.forEach(l => unplace(l.id));
  u.classId = classId; save(); render();
}
function addLesson(id) { const u = unitById(id); u.lessons.push({ id: uid(), title: `Stunde ${u.lessons.length + 1}`, note: '' }); save(); render(); }
function deleteLesson(unitId, lessonId) { const u = unitById(unitId); unplace(lessonId); u.lessons = u.lessons.filter(l => l.id !== lessonId); save(); render(); }
function moveLessonInUnit(unitId, i, dir) {
  const u = unitById(unitId);
  const j = i + dir; if (j < 0 || j >= u.lessons.length) return;
  [u.lessons[i], u.lessons[j]] = [u.lessons[j], u.lessons[i]];
  const placed = placedMap();   // Termine bleiben in Reihenfolge: Termine mittauschen
  const ki = placed[u.lessons[i].id], kj = placed[u.lessons[j].id];
  if (ki && kj) { state.placements[ki] = u.lessons[j].id; state.placements[kj] = u.lessons[i].id; }
  save(); render();
}
function removeUnitFromPlan(id) { unitById(id).lessons.forEach(l => unplace(l.id)); save(); render(); showToast('Reihe ist wieder „in Vorbereitung“'); }
// Reihe als neue Reihe (in Vorbereitung, ohne Datum) in eine Klasse kopieren
function copyUnitMenu(e, id) {
  e.stopPropagation();
  const u = unitById(id);
  showPop(e.currentTarget, `<h4>Reihe kopieren</h4><div class="sub">„${escHtml(u.title)}“ mit allen ${u.lessons.length} Stunden kopieren nach …</div>
    <div class="pop-actions">${state.classes.map(c => `<button class="btn ${c.id === u.classId ? '' : 'primary'}" onclick="copyUnit('${id}','${c.id}')"><span class="cdot" style="background:${classSubj(c).dot}"></span> ${escHtml(c.name)}${c.id === u.classId ? ' (gleiche Klasse)' : ''}</button>`).join('')}</div>`);
}
function copyUnit(id, classId) {
  const u = unitById(id);
  const copy = { ...JSON.parse(JSON.stringify(u)), id: uid(), classId, start: '' };
  if (classId === u.classId) copy.title += ' (Kopie)';
  copy.lessons.forEach(l => { l.id = uid(); });
  state.units.splice(state.units.indexOf(u) + 1, 0, copy);
  closePop(); save(); render();
  showToast(`Kopiert nach ${className(classId)} – Startdatum wählen, dann übertragen`);
}
function deleteUnit(id) {
  if (!confirm('Reihe wirklich löschen? Eingeplante Stunden verschwinden aus dem Planer.')) return;
  unitById(id).lessons.forEach(l => unplace(l.id));
  state.units = state.units.filter(x => x.id !== id);
  save(); render();
}
